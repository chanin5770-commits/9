<title>צעד אחר צעד</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F6F3FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="צעד אחר צעד">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: a single phone-width column (max 460px) that scrolls, with a fixed tab bar at the bottom. On desktop it floats centred on a soft field. */
:root {
  --bg: #F6F3FB;
  --field: #ECE6F6;
  --surface: #FFFFFF;
  --surface-2: #F1ECF8;
  --surface-3: #E6DFF2;
  --ink: #1D1530;
  --ink-2: #4E4566;
  --muted: #827A98;
  --line: #E4DDEF;
  --brand: #D63A72;
  --brand-ink: #FFFFFF;
  --brand-soft: #FBE3EC;
  --hero: linear-gradient(140deg, #FF8A3D 0%, #F0457A 55%, #B23AC9 100%);
  --hero-break: linear-gradient(140deg, #34D399 0%, #0F9D8A 55%, #0E6F86 100%);
  --good: #0F8A6E;
  --good-soft: #DDF4EC;
  --warn: #B86E00;
  --warn-soft: #FDF0D6;
  --bad: #C8323F;
  --bad-soft: #FBE1E3;
  --c-work: #5B4BE0;
  --c-study: #E8603C;
  --c-home: #0F9D8A;
  --c-health: #D9A100;
  --c-personal: #C2408E;
  --c-break: #9AA5B1;
  --shadow: 0 1px 2px rgba(40, 20, 70, .06), 0 8px 24px rgba(40, 20, 70, .08);
  --shadow-lg: 0 18px 50px rgba(120, 30, 90, .28);
  --f-display: "Fredoka", "Assistant", "Arial Hebrew", system-ui, sans-serif;
  --f-body: "Assistant", "Arial Hebrew", "Segoe UI", system-ui, sans-serif;
  --r-lg: 28px;
  --r-md: 18px;
  --r-sm: 12px;
  --nav-h: 68px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #110E19; --field: #0B0911; --surface: #1B1727; --surface-2: #231E33; --surface-3: #2E2842;
    --ink: #F4F0FB; --ink-2: #C9C0DC; --muted: #8E85A4; --line: #2F2943;
    --brand: #FF5C93; --brand-ink: #1A0710; --brand-soft: #3A1828;
    --good: #3DD6A8; --good-soft: #10302A; --warn: #F2B544; --warn-soft: #33270E; --bad: #FF7A84; --bad-soft: #3A161B;
    --c-work: #7E6CF5; --c-study: #E0603D; --c-home: #159C88; --c-health: #B08410; --c-personal: #D9559F; --c-break: #5E6875;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); --shadow-lg: 0 18px 50px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #110E19; --field: #0B0911; --surface: #1B1727; --surface-2: #231E33; --surface-3: #2E2842;
  --ink: #F4F0FB; --ink-2: #C9C0DC; --muted: #8E85A4; --line: #2F2943;
  --brand: #FF5C93; --brand-ink: #1A0710; --brand-soft: #3A1828;
  --good: #3DD6A8; --good-soft: #10302A; --warn: #F2B544; --warn-soft: #33270E; --bad: #FF7A84; --bad-soft: #3A161B;
  --c-work: #7E6CF5; --c-study: #E0603D; --c-home: #159C88; --c-health: #B08410; --c-personal: #D9559F; --c-break: #5E6875;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); --shadow-lg: 0 18px 50px rgba(0,0,0,.55);
  color-scheme: dark;
}
/* The app's own theme setting wins over the host and the system */
:root[data-mode="light"] {
  --bg: #F6F3FB; --field: #ECE6F6; --surface: #FFFFFF; --surface-2: #F1ECF8; --surface-3: #E6DFF2;
  --ink: #1D1530; --ink-2: #4E4566; --muted: #827A98; --line: #E4DDEF;
  --brand: #D63A72; --brand-ink: #FFFFFF; --brand-soft: #FBE3EC;
  --good: #0F8A6E; --good-soft: #DDF4EC; --warn: #B86E00; --warn-soft: #FDF0D6; --bad: #C8323F; --bad-soft: #FBE1E3;
  --c-work: #5B4BE0; --c-study: #E8603C; --c-home: #0F9D8A; --c-health: #D9A100; --c-personal: #C2408E; --c-break: #9AA5B1;
  --shadow: 0 1px 2px rgba(40,20,70,.06), 0 8px 24px rgba(40,20,70,.08); --shadow-lg: 0 18px 50px rgba(120,30,90,.28);
  color-scheme: light;
}
:root[data-mode="dark"] {
  --bg: #110E19; --field: #0B0911; --surface: #1B1727; --surface-2: #231E33; --surface-3: #2E2842;
  --ink: #F4F0FB; --ink-2: #C9C0DC; --muted: #8E85A4; --line: #2F2943;
  --brand: #FF5C93; --brand-ink: #1A0710; --brand-soft: #3A1828;
  --good: #3DD6A8; --good-soft: #10302A; --warn: #F2B544; --warn-soft: #33270E; --bad: #FF7A84; --bad-soft: #3A161B;
  --c-work: #7E6CF5; --c-study: #E0603D; --c-home: #159C88; --c-health: #B08410; --c-personal: #D9559F; --c-break: #5E6875;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); --shadow-lg: 0 18px 50px rgba(0,0,0,.55);
  color-scheme: dark;
}
/* Colour moods */
:root[data-accent="ocean"] { --hero: linear-gradient(140deg, #19C3D0 0%, #2B7BE9 55%, #4B3FC9 100%); --brand: #2563EB; --brand-soft: color-mix(in srgb, var(--brand) 16%, var(--surface)); --brand-ink: #FFFFFF; --shadow-lg: 0 18px 50px rgba(30,70,160,.3); }
:root[data-accent="forest"] { --hero: linear-gradient(140deg, #A3D94B 0%, #22A35A 50%, #0E7C7B 100%); --brand: #13845F; --brand-soft: color-mix(in srgb, var(--brand) 16%, var(--surface)); --brand-ink: #FFFFFF; --shadow-lg: 0 18px 50px rgba(20,100,70,.3); }
:root[data-accent="dusk"] { --hero: linear-gradient(140deg, #FFC044 0%, #F26B1D 50%, #C21E4E 100%); --brand: #D9480F; --brand-soft: color-mix(in srgb, var(--brand) 16%, var(--surface)); --brand-ink: #FFFFFF; --shadow-lg: 0 18px 50px rgba(170,60,20,.3); }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--field);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  direction: rtl;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

.app {
  position: relative;
  max-width: 460px;
  min-height: 100%;
  margin: 0 auto;
  background: var(--bg);
  padding-bottom: calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
  overflow-x: clip;
}
@media (min-width: 520px) {
  .app { box-shadow: 0 0 0 1px var(--line), 0 30px 80px rgba(30, 10, 60, .12); }
}
.screen {
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-block: 18px 8px;
  display: flex; flex-direction: column; gap: 18px;
  animation: screenIn .35s cubic-bezier(.2,.8,.2,1);
}
.screen[hidden] { display: none !important; }
@keyframes screenIn { from { opacity: .001; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.topbar h1 { font-size: 28px; line-height: 1.15; }
.eyebrow { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.sub { color: var(--ink-2); font-size: 15px; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; flex: none;
  background: var(--surface); color: var(--ink-2); box-shadow: var(--shadow);
  transition: transform .15s ease;
}
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 22px; height: 22px; }

.card { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 16px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.section-head h2 { font-size: 19px; }
.link-btn { color: var(--brand); font-weight: 700; font-size: 14px; padding: 6px 4px; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.demo { background: var(--warn-soft); color: var(--warn); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border-radius: 16px; font-weight: 700; font-size: 16px;
  background: var(--surface-2); color: var(--ink);
  transition: transform .15s ease, background .2s ease, opacity .2s;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--brand); color: var(--brand-ink); box-shadow: 0 6px 16px color-mix(in srgb, var(--brand) 35%, transparent); }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.block { width: 100%; }
.btn svg { width: 20px; height: 20px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

/* ---------- Today ---------- */
.greet h1 { font-size: 30px; }
.greet .dates { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--muted); font-size: 14px; font-weight: 600; }
.quote { font-size: 15px; color: var(--ink-2); padding: 12px 14px; border-radius: var(--r-sm); background: var(--surface-2); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-sm); background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 600; }
.banner .grow { flex: 1; min-width: 0; }
.banner button { font-weight: 800; text-decoration: underline; text-underline-offset: 3px; color: inherit; }

.hero {
  position: relative; overflow: hidden; isolation: isolate;
  border-radius: var(--r-lg); padding: 20px 20px 18px; color: #fff;
  background: var(--hero); box-shadow: var(--shadow-lg);
}
.hero.break { background: var(--hero-break); box-shadow: 0 18px 50px rgba(15, 120, 110, .3); }
.hero::before, .hero::after {
  content: ""; position: absolute; border-radius: 50%; z-index: -1; pointer-events: none;
  background: radial-gradient(circle, rgba(255,255,255,.35), rgba(255,255,255,0) 70%);
}
.hero::before { width: 260px; height: 260px; top: -120px; left: -80px; animation: drift 12s ease-in-out infinite alternate; }
.hero::after { width: 180px; height: 180px; bottom: -90px; right: -40px; opacity: .6; animation: drift 9s ease-in-out infinite alternate-reverse; }
@keyframes drift { from { transform: translate(0,0); } to { transform: translate(30px, 20px); } }
.hero-top { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hero .chip { background: rgba(255,255,255,.2); backdrop-filter: blur(6px); color: #fff; padding: 4px 11px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.hero .chip.live { background: rgba(255,255,255,.95); color: #B0204F; display: inline-flex; gap: 6px; align-items: center; }
.hero.break .chip.live { color: #0B6B60; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
.hero-title { font-size: 26px; line-height: 1.2; margin-top: 12px; }
.hero-meta { font-size: 14px; opacity: .9; margin-top: 4px; font-weight: 600; }
.timer { display: flex; align-items: center; gap: 18px; margin-top: 16px; }
.ring { position: relative; width: 132px; height: 132px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: scaleX(-1) rotate(-90deg); }
.ring .track { stroke: rgba(255,255,255,.22); }
.ring .bar { stroke: #fff; transition: stroke-dashoffset .4s linear; }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.tm-time { font-family: var(--f-display); font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; direction: ltr; }
.tm-label { font-size: 12px; font-weight: 700; opacity: .9; margin-top: 6px; }
.tm-side { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
.tm-ctrl { display: flex; gap: 8px; flex-wrap: wrap; }
.glass-btn { min-height: 40px; padding: 0 12px; border-radius: 12px; background: rgba(255,255,255,.18); color: #fff; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; transition: background .2s, transform .15s; }
.glass-btn:active { transform: scale(.95); background: rgba(255,255,255,.3); }
.glass-btn svg { width: 18px; height: 18px; }
.tm-note { font-size: 13px; opacity: .85; }
.hero-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 18px; }
.act-btn { min-height: 54px; border-radius: 16px; font-weight: 800; font-size: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: transform .15s ease; }
.act-btn:active { transform: scale(.95); }
.act-btn svg { width: 20px; height: 20px; }
.act-btn.start { background: #fff; color: #A11D4C; }
.hero.break .act-btn.start { color: #0B6B60; }
.act-btn.done { background: rgba(255,255,255,.22); color: #fff; }
.act-btn.fail { background: rgba(0,0,0,.14); color: #fff; }
.hero-empty { text-align: center; padding: 10px 0 4px; }
.hero-empty .big { font-size: 46px; line-height: 1; }
.hero-empty h2 { font-size: 24px; margin-top: 8px; }
.hero-empty p { opacity: .92; margin-top: 6px; }
.hero-empty .row { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.hero-empty .row .act-btn { padding: 0 16px; min-height: 46px; flex-direction: row; }

.progress-card { display: flex; gap: 14px; align-items: center; }
.progress-card .mini-ring { width: 64px; height: 64px; flex: none; position: relative; }
.progress-card .mini-ring svg { width: 100%; height: 100%; transform: scaleX(-1) rotate(-90deg); }
.progress-card .mini-ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 600; font-size: 17px; }
.progress-card .txt { flex: 1; min-width: 0; }
.progress-card .txt b { font-family: var(--f-display); font-weight: 600; font-size: 18px; }
.segbar { display: flex; gap: 3px; margin-top: 8px; height: 8px; }
.segbar span { flex: 1; border-radius: 4px; background: var(--surface-3); }
.segbar span.done { background: var(--good); }
.segbar span.missed { background: var(--bad); }
.segbar span.active { background: var(--brand); animation: pulse 1.6s infinite; }

.timeline { display: flex; flex-direction: column; gap: 8px; }
.slot { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: stretch; }
.slot .t { font-family: var(--f-display); font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); padding-top: 12px; text-align: center; direction: ltr; }
.slot-card {
  position: relative; display: flex; align-items: center; gap: 12px; text-align: start; width: 100%;
  padding: 12px 14px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow);
  border-inline-start: 5px solid var(--cat, var(--c-break)); min-width: 0;
  transition: transform .15s ease;
}
.slot-card:active { transform: scale(.98); }
.slot-card .body { flex: 1; min-width: 0; }
.slot-card .title { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.slot-card .meta { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }
.slot.is-done .title { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ink) 40%, transparent); color: var(--muted); }
.slot.is-current .slot-card { box-shadow: 0 0 0 2px var(--brand), var(--shadow); }
.slot.is-break .slot-card { background: repeating-linear-gradient(-45deg, var(--surface), var(--surface) 8px, var(--surface-2) 8px, var(--surface-2) 16px); }
.status-ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--muted); }
.status-ic svg { width: 16px; height: 16px; }
.status-ic.done { background: var(--good-soft); color: var(--good); }
.status-ic.missed { background: var(--bad-soft); color: var(--bad); }
.status-ic.active { background: var(--brand-soft); color: var(--brand); }
.now-line { display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: center; color: var(--brand); font-weight: 800; font-size: 12px; }
.now-line .ln { height: 2px; background: var(--brand); border-radius: 2px; position: relative; }
.now-line .ln::before { content: ""; position: absolute; inset-inline-start: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--brand); }
.now-line span:first-child { text-align: center; direction: ltr; font-family: var(--f-display); }
.empty { text-align: center; padding: 26px 16px; color: var(--muted); border: 2px dashed var(--line); border-radius: var(--r-md); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty b { color: var(--ink); font-size: 17px; font-family: var(--f-display); font-weight: 600; }

.blur-titles .slot-card .title, .blur-titles .hero-title, .blur-titles .plan-item .title { filter: blur(6px); transition: filter .2s; }
.blur-titles .slot-card:hover .title, .blur-titles .plan-item:hover .title, .blur-titles .hero:hover .hero-title { filter: none; }

/* ---------- Plan ---------- */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); padding: 4px; border-radius: 14px; gap: 4px; }
.seg button { min-height: 38px; border-radius: 10px; font-weight: 700; font-size: 15px; color: var(--ink-2); transition: background .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.daystrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.daystrip button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 6px; border-radius: 14px; font-size: 12px; font-weight: 700; color: var(--muted); position: relative; }
.daystrip button .n { font-family: var(--f-display); font-size: 18px; color: var(--ink); font-weight: 500; }
.daystrip button[aria-current="date"] { background: var(--brand); color: var(--brand-ink); }
.daystrip button[aria-current="date"] .n { color: var(--brand-ink); }
.daystrip button.today:not([aria-current="date"]) .n { color: var(--brand); font-weight: 700; }
.daystrip button .has { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .6; }
.daystrip button .has.none { opacity: 0; }
.datenav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.datenav .lbl { font-weight: 800; font-size: 17px; font-family: var(--f-display); text-align: center; flex: 1; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
.toolbar .btn { flex: 1 1 auto; min-height: 44px; padding: 0 12px; font-size: 15px; }
.plan-list { display: flex; flex-direction: column; gap: 8px; position: relative; }
.plan-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 12px; border-radius: 16px;
  background: var(--surface); box-shadow: var(--shadow); border-inline-start: 5px solid var(--cat, var(--c-break));
  touch-action: pan-y; user-select: none; -webkit-user-select: none;
  transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s;
}
.plan-item.is-break { background: repeating-linear-gradient(-45deg, var(--surface), var(--surface) 8px, var(--surface-2) 8px, var(--surface-2) 16px); }
.plan-item.dragging { transition: none; z-index: 5; position: relative; box-shadow: 0 16px 40px rgba(30,10,60,.25); transform: scale(1.02); }
.plan-item .handle { width: 36px; height: 44px; display: grid; place-items: center; color: var(--muted); touch-action: none; cursor: grab; border-radius: 10px; flex: none; }
.plan-item .handle svg { width: 20px; height: 20px; }
.plan-item .body { flex: 1; min-width: 0; text-align: start; }
.plan-item .title { font-weight: 700; overflow-wrap: anywhere; }
.plan-item .meta { font-size: 13px; color: var(--muted); font-weight: 600; display: flex; gap: 8px; flex-wrap: wrap; }
.plan-item .time { font-family: var(--f-display); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.plan-item.st-done .title { text-decoration: line-through; color: var(--muted); }
.gap-note { font-size: 12px; color: var(--muted); text-align: center; font-weight: 700; }
.hint { font-size: 13px; color: var(--muted); }

.week { display: flex; flex-direction: column; gap: 8px; }

/* Example data: today built around the current time, plus 13 past days for the charts. All flagged sample:true. */
function seedTasks() {
  const tasks = [];
  const today = todayKey();
  const mk = (date, start, dur, title, cat, extra = {}) => tasks.push({ id: uid(), date, start: fromMin(start), dur, title, cat, type: 'task', status: 'todo', focusedSec: 0, sample: true, ...extra });
  const brk = (date, start, dur, title = 'הפסקה') => tasks.push({ id: uid(), date, start: fromMin(start), dur, title, cat: 'break', type: 'break', status: 'todo', focusedSec: 0, sample: true });

  let t = Math.floor(nowMin() / 30) * 30; // current half hour
  let s = t - 120;
  const plan = [
    [45, 'תכנון בוקר וקפה', 'personal', 'done'],
    [15, 'הפסקה קצרה', 'break', 'done'],
    [50, 'כתיבת המצגת ללקוחה', 'work', 'now'],
    [10, 'הפסקה ומים', 'break'],
    [40, 'מענה למיילים חשובים', 'work'],
    [30, 'הליכה של חצי שעה', 'health'],
    [45, 'קריאה לקורס', 'study'],
    [20, 'קניות לשבת', 'home'],
    [15, 'סיכום יום ותכנון מחר', 'personal'],
  ];
  // make the "now" item land on the current half hour
  s = t - 60;
  for (const [dur, title, cat, st] of plan) {
    if (s < 0) { s += dur; continue; }
    if (s + dur >= 24 * 60) break;
    if (cat === 'break') brk(today, s, dur, title); else mk(today, s, dur, title, cat);
    const last = tasks[tasks.length - 1];
    if (st === 'done') { last.status = 'done'; last.focusedSec = dur * 60; last.doneAt = Date.now(); }
    s += dur;
  }

  // History: deterministic pseudo-random so it looks the same on every first load
  let seed = 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const pool = [
    ['עבודה עמוקה על הפרויקט', 'work', 90], ['פגישת צוות', 'work', 45], ['מיילים והודעות', 'work', 30], ['הכנת דוח שבועי', 'work', 60],
    ['תרגול לקורס', 'study', 45], ['צפייה בהרצאה', 'study', 60],
    ['כביסה וסידור', 'home', 30], ['בישול לשבוע', 'home', 60],
    ['אימון', 'health', 45], ['הליכה', 'health', 30],
    ['שיחה עם חברה', 'personal', 30], ['יומן ותכנון', 'personal', 15],
  ];
  for (let back = 13; back >= 1; back--) {
    const date = addDays(today, -back);
    const dow = dateOf(date).getDay();
    if (dow === 6) continue; // rest on Shabbat
    const count = dow === 5 ? 3 : 4 + Math.floor(rnd() * 3);
    let m = 8 * 60 + 30;
    const used = new Set();
    for (let i = 0; i < count; i++) {
      let p; do { p = pool[Math.floor(rnd() * pool.length)]; } while (used.has(p[0]));
      used.add(p[0]);
      const r = rnd();
      const okRate = back > 6 ? 0.68 : 0.8;
      const status = r < okRate ? 'done' : 'missed';
      mk(date, m, p[2], p[0], p[1], { status, focusedSec: status === 'done' ? Math.round(p[2] * 60 * (0.75 + rnd() * 0.25)) : 0 });
      m += p[2];
      if (i % 2 === 1) { brk(date, m, 15); tasks[tasks.length - 1].status = 'done'; m += 15; }
    }
  }
  return tasks;
}

/* ================= Task helpers ================= */
const tasksOn = (k) => S.tasks.filter((t) => t.date === k).sort((a, b) => toMin(a.start) - toMin(b.start) || (a.order ?? 0) - (b.order ?? 0));
const getTask = (id) => S.tasks.find((t) => t.id === id);
const endMin = (t) => toMin(t.start) + t.dur;
const isWork = (t) => t.type !== 'break';

function currentTask() {
  const k = todayKey();
  const list = tasksOn(k);
  if (S.timer && S.timer.taskId) { const t = getTask(S.timer.taskId); if (t && t.date === k && t.status !== 'done' && t.status !== 'missed') return t; }
  const active = list.find((t) => t.status === 'active'); if (active) return active;
  if (S.focusId) { const f = getTask(S.focusId); if (f && f.date === k && f.status === 'todo') return f; }
  const n = nowMin();
  const open = list.filter((t) => t.status === 'todo');
  return open.find((t) => toMin(t.start) <= n && endMin(t) > n) || open.find((t) => toMin(t.start) > n) || open[0] || null;
}

function reflow(list, startAt) {

/* ================= Sound, vibration, confetti ================= */
let actx;
function chime() {
  if (!S.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();

      o.connect(g).connect(actx.destination); o.start(t0 + i * 0.16); o.stop(t0 + i * 0.16 + 1);
    });
  } catch { /* audio unavailable */ }
}

/* ================= Timer ================= */
// S.timer = { taskId|null, label, total (sec), remaining (sec), endsAt (ms)|null, running, segStart (ms)|null }
let wakeLock = null;
async function holdWake(on) {
  try {
    if (on && 'wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener?.('release', () => { wakeLock = null; }); }
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch { wakeLock = null; }
}
function timerRemaining() {
  const tm = S.timer; if (!tm) return 0;
  return tm.running ? Math.max(0, (tm.endsAt - Date.now()) / 1000) : tm.remaining;
}
function creditFocus() {
  const tm = S.timer; if (!tm || !tm.running || !tm.segStart) return;
  const t = tm.taskId && getTask(tm.taskId);
  const sec = Math.min((Date.now() - tm.segStart) / 1000, tm.total);
  if (t) t.focusedSec = Math.round((t.focusedSec || 0) + sec);
  tm.segStart = Date.now();
}
function timerStart(taskId, minutes, label) {
  if (S.timer) timerStop();
  const total = Math.round(minutes * 60);
  S.timer = { taskId, label: label || '', total, remaining: total, endsAt: Date.now() + total * 1000, running: true, segStart: Date.now() };
  holdWake(true); save(); tick(true);
}
function timerPause() { const tm = S.timer; if (!tm || !tm.running) return; creditFocus(); tm.remaining = timerRemaining(); tm.running = false; tm.endsAt = null; tm.segStart = null; holdWake(false); save(); tick(true); }
function timerResume() { const tm = S.timer; if (!tm || tm.running) return; if (tm.remaining <= 0) tm.remaining = tm.total = 5 * 60; tm.endsAt = Date.now() + tm.remaining * 1000; tm.running = true; tm.segStart = Date.now(); holdWake(true); save(); tick(true); }
function timerAdd(min) { const tm = S.timer; if (!tm) return; tm.total += min * 60; if (tm.running) tm.endsAt += min * 60000; else tm.remaining += min * 60; save(); tick(true); }
function timerReset() { const tm = S.timer; if (!tm) return; creditFocus(); tm.remaining = tm.total; if (tm.running) { tm.endsAt = Date.now() + tm.total * 1000; tm.segStart = Date.now(); } save(); tick(true); }
function timerStop() { if (!S.timer) return; creditFocus(); S.timer = null; holdWake(false); save(); }
function timerFinished(silent) {
  const tm = S.timer; if (!tm) return;
  creditFocus();
  tm.running = false; tm.remaining = 0; tm.endsAt = null; tm.segStart = null;
  holdWake(false); save();
  if (!silent) { chime(); buzz([200, 100, 200, 100, 400]); }
  const t = tm.taskId && getTask(tm.taskId);
  if (t && t.status === 'active') {
    openSheet(`<h3>הזמן הסתיים ⏰</h3><p class="sub">איך הלך עם <b>${esc(t.title)}</b>?</p>
      <div class="option-list">
        <button class="option" data-act="task-done" data-arg="${t.id}"><span class="ic">${IC.check}</span><span><b>סיימתי</b><small>מסמנת כבוצע וממשיכה הלאה</small></span></button>
        <button class="option" data-act="timer-extend" data-arg="5"><span class="ic">${IC.plus}</span><span><b>עוד 5 דקות</b><small>הטיימר ממשיך מאותה נקודה</small></span></button>
        <button class="option" data-act="task-fail" data-arg="${t.id}"><span class="ic">${IC.later}</span><span><b>לא הצלחתי</b><small>נמצא יחד פתרון</small></span></button>
      </div>`);
  } else {
    toast(tm.label ? `${tm.label} הסתיים` : 'הטיימר הסתיים');
    S.timer = null; save();
  }
  renderAll();
}
const RING_C = 2 * Math.PI * 58;
function tick(force) {
  const tm = S.timer;
  if (tm && tm.running && Date.now() >= tm.endsAt) { timerFinished(); return; }
  const rem = timerRemaining();
  const timeEl = $('#tm-time');
  if (timeEl) {
    const cur = $('#hero')?.dataset.task;
    const mine = tm && (tm.taskId === cur || (!tm.taskId && !cur));
    if (mine) {
      timeEl.textContent = fmtClock(rem);
      const bar = $('#tm-bar'); if (bar) bar.style.strokeDashoffset = String(RING_C * (1 - rem / tm.total));
    }
  }
  const mt = $('#mini-time'); if (mt) mt.textContent = fmtClock(rem);
  if (tm && tm.running) document.title = `${fmtClock(rem)} · צעד אחר צעד`; else if (document.title !== 'צעד אחר צעד') document.title = 'צעד אחר צעד';
  if (force) { renderMiniTimer(); }
  // In-app reminder when a task's start time arrives while the app is open
  if (S.settings.inAppReminders) {
    const n = nowMin(); const k = todayKey();
    for (const t of tasksOn(k)) {
      if (t.status === 'todo' && toMin(t.start) === n && !t.reminded && (!tm || tm.taskId !== t.id)) {
        t.reminded = true; save(); toast(`הגיע הזמן: ${t.title}`); chime(); buzz(200);
        if (S.ui.tab === 'today') renderToday();
      }
    }
  }
}

function renderProgress() {
  const el = $('#scr-progress');
  const off = S.ui.progWeek || 0;
  const ws = addDays(weekStart(todayKey()), off * 7);
  const days = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
  const stats = days.map(dayStats);
  const prevStats = Array.from({ length: 7 }, (_, i) => dayStats(addDays(ws, i - 7)));
  const sum = (arr, f) => arr.reduce((a, s) => a + s[f], 0);
  const planned = sum(stats, 'planned'), done = sum(stats, 'done'), focus = sum(stats, 'focus');
  const pct = planned ? Math.round((done / planned) * 100) : 0;
  const pPlanned = sum(prevStats, 'planned'), pDone = sum(prevStats, 'done');
  const pPct = pPlanned ? Math.round((pDone / pPlanned) * 100) : null;
  const delta = pPct == null ? null : pct - pPct;
  const streak = calcStreak();
  const hasSample = days.some((d) => S.tasks.some((t) => t.date === d && t.sample));

  // Bar chart: planned as track, done as fill
  const W = 340, H = 190, padT = 18, padB = 26, padX = 8;
  const maxV = Math.max(4, ...stats.map((s) => s.planned));
  const step = Math.ceil(maxV / 4); const top = step * 4;
  const y = (v) => padT + (H - padT - padB) * (1 - v / top);
  const colW = (W - padX * 2) / 7; const bw = Math.min(30, colW - 14);
  const tk = todayKey();
  let svg = '';
  for (let g = 0; g <= 4; g++) { const v = g * step; svg += `<line class="grid" x1="${padX}" x2="${W - padX}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${W - padX + 4}" y="${y(v) + 4}" text-anchor="start">${v}</text>`; }
  days.forEach((d, i) => {
    const s = stats[i];
    const cx = W - padX - colW * (i + 0.5); // RTL: Sunday on the right
    const x = cx - bw / 2;
    const bar = (v, fill, op) => { if (!v) return ''; const yy = y(v), h = y(0) - yy; const r = Math.min(4, h / 2); return `<path d="M${x},${y(0)} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${y(0)} Z" fill="${fill}" ${op ? `opacity="${op}"` : ''}/>`; };
    svg += bar(s.planned, 'var(--surface-3)');
    svg += bar(s.done, 'var(--brand)');
    if (d === tk || (s.done && s.done === s.planned && s.planned >= 3)) svg += `<text class="lbl" x="${cx}" y="${y(s.done || 0) - 6}" text-anchor="middle">${s.done}</text>`;
    svg += `<text class="axis" x="${cx}" y="${H - 6}" text-anchor="middle" ${d === tk ? 'style="fill:var(--brand)"' : ''}>${DAY_SHORT[i]}</text>`;
    svg += `<rect x="${cx - colW / 2}" y="0" width="${colW}" height="${H}" fill="transparent" data-tip="${i}" style="cursor:pointer"/>`;
  });

  // Categories
  const catAgg = {};
  days.forEach((d) => tasksOn(d).filter(isWork).forEach((t) => { const c = CATS[t.cat] ? t.cat : 'personal'; catAgg[c] = catAgg[c] || { min: 0, done: 0, n: 0 }; catAgg[c].n++; if (t.status === 'done') { catAgg[c].done++; catAgg[c].min += Math.round((t.focusedSec || t.dur * 60) / 60); } }));
  const catMax = Math.max(1, ...Object.values(catAgg).map((c) => c.min));
  const catRows = Object.keys(CATS).filter((c) => catAgg[c]).map((c) => `<div class="catrow"><span>${CATS[c].label}</span><span class="tr"><i style="--cat:var(${CATS[c].v});width:${(catAgg[c].min / catMax) * 100}%"></i></span><span class="val">${fmtDur(catAgg[c].min)}</span></div>`).join('');

  // Summary
  const best = stats.map((s, i) => ({ ...s, i })).filter((s) => s.planned).sort((a, b) => b.done / b.planned - a.done / a.planned || b.done - a.done)[0];
  const missedCat = {}; days.forEach((d) => tasksOn(d).filter((t) => t.status === 'missed').forEach((t) => { missedCat[t.cat] = (missedCat[t.cat] || 0) + 1; }));
  const worstCat = Object.entries(missedCat).sort((a, b) => b[1] - a[1])[0];
  const summary = planned ? `
    <p>${off === 0 ? 'השבוע' : 'בשבוע הזה'} תכננת <b>${planned} משימות</b> וביצעת <b>${done}</b>, כלומר <b>${pct}%</b>. ${delta == null ? '' : delta > 0 ? `זה שיפור של ${delta} נקודות לעומת השבוע שקדם לו.` : delta < 0 ? `זה ${-delta} נקודות פחות מהשבוע שקדם לו, וזה בסדר. שבועות משתנים.` : 'בדיוק כמו בשבוע שקדם לו.'}</p>
    ${best ? `<p>היום החזק שלך: <b>יום ${DAY_LONG[best.i]}</b>, עם ${best.done} מתוך ${best.planned}.</p>` : ''}
    ${worstCat ? `<p>הכי הרבה משימות נדחו בתחום <b>${(CATS[worstCat[0]] || CATS.personal).label}</b>. כדאי לנסות לפרק אותן לצעדים של 10–15 דקות.</p>` : '<p>אף משימה לא סומנה כ"לא הצלחתי". מרשים!</p>'}
    <p>${focus >= 300 ? `צברת <b>${fmtDur(focus)}</b> של פוקוס.` : `צברת <b>${focus} דקות</b> של פוקוס. כל טיימר נחשב.`}</p>`
    : '<p>אין עדיין משימות בשבוע הזה. הסיכום יופיע כאן כשתתחילי לסמן משימות.</p>';

  const RC = 2 * Math.PI * 34;
  el.innerHTML = `
    <header class="topbar"><div><p class="eyebrow">ההתקדמות שלי</p><h1>${off === 0 ? 'השבוע שלך' : off === -1 ? 'השבוע שעבר' : `לפני ${-off} שבועות`}</h1><p class="sub">${esc(fmtDateShort(days[0]))} – ${esc(fmtDateShort(days[6]))}</p></div>
    ${hasSample ? '<span class="pill demo">כולל נתוני דוגמה</span>' : ''}</header>
    <div class="seg" role="group" aria-label="בחירת שבוע">
      <button data-act="prog-week" data-arg="-1" aria-pressed="${off === -1}">שבוע שעבר</button>
      <button data-act="prog-week" data-arg="0" aria-pressed="${off === 0}">השבוע</button>
    </div>
    <div class="stats">
      <div class="stat lead">
        <svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="34" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="9"/><circle cx="42" cy="42" r="34" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-dasharray="${RC}" stroke-dashoffset="${RC * (1 - pct / 100)}"/></svg>
        <div><span class="k">אחוז ביצוע</span><div class="v">${pct}%</div><span class="d">${delta == null ? 'אין נתונים מהשבוע הקודם' : delta >= 0 ? `▲ ${delta} נק׳ משבוע קודם` : `▼ ${-delta} נק׳ משבוע קודם`}</span></div>
      </div>
      <div class="stat"><span class="k">משימות שבוצעו</span><span class="v">${done}<small> /${planned}</small></span></div>
      <div class="stat"><span class="k">זמן פוקוס</span><span class="v">${Math.floor(focus / 60)}<small>ש׳</small> ${focus % 60}<small>ד׳</small></span></div>
      <div class="stat"><span class="k">רצף ימים</span><span class="v">${streak}<small> ${streak === 1 ? 'יום' : 'ימים'}</small></span><span class="d" style="color:var(--warn)">${streak ? '🔥 כל הכבוד' : 'מתחילים היום'}</span></div>
      <div class="stat"><span class="k">לא הצליחו</span><span class="v">${sum(stats, 'missed')}</span><span class="d" style="color:var(--muted)">והן חלק מהדרך</span></div>
    </div>
    <div class="card">
      <div class="section-head"><h2>משימות לפי יום</h2></div>
      <div class="legend" style="margin:8px 0 6px"><span><i style="background:var(--brand)"></i>בוצעו</span><span><i style="background:var(--surface-3)"></i>תוכננו</span></div>
      <div class="chart-wrap" id="chart"><svg viewBox="0 0 ${W + 22} ${H}" role="img" aria-label="תרשים עמודות של משימות מתוכננות ומבוצעות לפי יום">${svg}</svg><div class="tip" id="tip" hidden></div></div>
      <details class="table-view" style="margin-top:10px"><summary>הצגה כטבלה</summary><div class="tbl"><table><thead><tr><th>יום</th><th>תוכננו</th><th>בוצעו</th><th>לא הצליחו</th><th>פוקוס</th></tr></thead><tbody>${stats.map((s, i) => `<tr><td>${DAY_LONG[i]}</td><td>${s.planned}</td><td>${s.done}</td><td>${s.missed}</td><td>${s.focus} דק׳</td></tr>`).join('')}</tbody></table></div></details>
    </div>
    <div class="card"><div class="section-head"><h2>זמן לפי תחום</h2><span class="hint">משימות שבוצעו</span></div>
      <div class="catrows" style="margin-top:12px">${catRows || '<p class="hint">עוד אין משימות שבוצעו בשבוע הזה.</p>'}</div></div>
    <div class="card summary"><div class="section-head" style="margin-bottom:8px"><h2>סיכום שבועי</h2><span class="pill">מחושב מהנתונים שלך</span></div>${summary}</div>
    <div class="section-head"><h2>הישגים</h2><span class="hint">${achievements().filter((a) => a.v >= a.max).length} מתוך ${achievements().length}</span></div>
    <div class="badges">${achievements().map((a) => { const ok = a.v >= a.max; return `<div class="badge ${ok ? '' : 'locked'}"><span class="medal">${a.ic}</span><b>${a.t}</b><small>${a.d}</small>${ok ? '<span class="pill good" style="font-size:11px;padding:2px 8px">הושג</span>' : `<span class="pbar"><i style="width:${(a.v / a.max) * 100}%"></i></span><small class="num">${a.v}/${a.max}</small>`}</div>`; }).join('')}</div>`;

  // Tooltip on tap/hover
  const chart = $('#chart'), tip = $('#tip');
  const showTip = (e) => {
    const r = e.target.closest('[data-tip]'); if (!r) { tip.hidden = true; return; }

  chart.addEventListener('pointermove', showTip);
  chart.addEventListener('pointerdown', showTip);
  chart.addEventListener('pointerleave', () => { tip.hidden = true; });
}

/* ================= Drag to reorder (Plan) ================= */
function setupDrag() {
  const list = $('#plan-list'); if (!list) return;
  let st = null;
  list.addEventListener('pointerdown', (e) => {
    const h = e.target.closest('[data-drag]'); if (!h) return;
    e.preventDefault();
    const item = h.closest('.plan-item');
    const items = $$('.plan-item', list);
    st = { item, items, from: items.indexOf(item), to: items.indexOf(item), y0: e.clientY, rects: items.map((x) => x.getBoundingClientRect()), id: e.pointerId };
    h.setPointerCapture(e.pointerId);
    item.classList.add('dragging');
    buzz(15);
  });
  list.addEventListener('pointermove', (e) => {
    if (!st || e.pointerId !== st.id) return;
    const dy = e.clientY - st.y0;
    st.item.style.transform = `translateY(${dy}px) scale(1.02)`;
    const r = st.rects[st.from]; const mid = r.top + r.height / 2 + dy;
    let to = st.from;
    st.rects.forEach((rr, i) => { const m = rr.top + rr.height / 2; if (i > st.from && mid > m) to = i; if (i < st.from && mid < m && to === st.from) to = i; });
    if (to < st.from) { for (let i = st.from - 1; i >= 0; i--) if (mid < st.rects[i].top + st.rects[i].height / 2) to = i; }
    st.to = to;
    const h = r.height + 8;
    st.items.forEach((x, i) => { if (x === st.item) return; let s = 0; if (st.from < to && i > st.from && i <= to) s = -h; if (st.from > to && i >= to && i < st.from) s = h; x.style.transform = s ? `translateY(${s}px)` : ''; });
    // auto-scroll near edges
    if (e.clientY < 80) window.scrollBy(0, -8); else if (e.clientY > innerHeight - 140) window.scrollBy(0, 8);
  });
  const end = (e) => {
    if (!st || e.pointerId !== st.id) return;
    const { from, to } = st; st.items.forEach((x) => { x.style.transform = ''; }); st.item.classList.remove('dragging');
    st = null;
    if (from !== to) moveTask(from, to);
  };
  list.addEventListener('pointerup', end);
  list.addEventListener('pointercancel', end);
  list.addEventListener('keydown', (e) => {
    const h = e.target.closest('[data-drag]'); if (!h) return;
    const items = $$('.plan-item', list); const i = items.indexOf(h.closest('.plan-item'));
    if (e.key === 'ArrowUp' && i > 0) { e.preventDefault(); moveTask(i, i - 1, true); }
    if (e.key === 'ArrowDown' && i < items.length - 1) { e.preventDefault(); moveTask(i, i + 1, true); }
  });
}
function moveTask(from, to, keepFocus) {
  const k = S.ui.planDate;
  const list = tasksOn(k);
  const startAt = toMin(list[0].start);
  snapshot();
  const [m] = list.splice(from, 1); list.splice(to, 0, m);
  reflow(list, startAt);
  save(); renderPlan(); renderToday();
  toast('הסדר עודכן והשעות סודרו ברצף', { undo: true });
  if (keepFocus) { const h = $(`.plan-item[data-id="${m.id}"] [data-drag]`); h && h.focus(); }
}

function markDone(t) {

  'chat-clear': () => { S.chat = []; save(); renderCoach(); toast('השיחה נוקתה'); },
  set: (a) => { const [k, v] = a.split(':'); S.settings[k] = v; save(); applyLook(); renderSettings(); },
  'test-sound': () => { const was = S.settings.sound; S.settings.sound = true; chime(); S.settings.sound = was; buzz(120); },
  export: async () => {
    const txt = JSON.stringify({ app: 'צעד אחר צעד', exported: new Date().toISOString(), settings: S.settings, tasks: S.tasks }, null, 1);
    try { await navigator.clipboard.writeText(txt); toast('הנתונים הועתקו ללוח'); }
    catch {
      openSheet(`<h3>העתקת הנתונים</h3><p class="sub">הדפדפן לא איפשר העתקה אוטומטית. סמני את הטקסט והעתיקי ידנית.</p><textarea id="export-txt" readonly style="width:100%;height:220px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);padding:10px;direction:ltr;font-size:12px">${esc(txt)}</textarea><button class="btn block" data-act="sheet-close">סגירה</button>`);
      setTimeout(() => { const ta = $('#export-txt'); ta && ta.select(); }, 100);
    }
  },
  'rest-preview': () => showRest(true),
  'rest-close': () => { shabbatDismissed = true; $('#shabbat-root').innerHTML = ''; },
  'add-holiday': () => { const v = $('#holiday-date').value; if (!v) { toast('בחרי תאריך'); return; } if (!S.settings.holidays.includes(v)) S.settings.holidays.push(v); save(); renderSettings(); toast(`${fmtDateShort(v)} סומן כיום חג`); shabbatDismissed = false; showRest(false); },
  'del-holiday': (a) => { S.settings.holidays = S.settings.holidays.filter((h) => h !== a); save(); renderSettings(); showRest(false); },
  'prog-week': (a) => { S.ui.progWeek = +a; save(); renderProgress(); },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  fn(el.dataset.arg, el);
});
// Settings inputs
document.addEventListener('change', (e) => {
  const id = e.target.id || '';
  if (!id.startsWith('set-')) return;
  const k = id.slice(4); const st = S.settings;
  if (e.target.type === 'checkbox') st[k] = e.target.checked;
  else if (e.target.type === 'number') { const min = +e.target.min || 5, max = +e.target.max || 600; st[k] = clamp(Math.round(+e.target.value || st[k]), min, max); e.target.value = st[k]; }
  else st[k] = e.target.value;
  save();
  if (k === 'name') { toast(st.name ? `נעים להכיר, ${st.name}!` : 'השם הוסר'); renderToday(); }
  else toast('נשמר');
  if (k === 'shabbat' || k === 'candle' || k === 'havdalah') { shabbatDismissed = false; showRest(false); renderSettings(); }
  if (k === 'discreet') renderToday();
});
document.getElementById('chat-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const inp = $('#chat-input'); const v = inp.value.trim(); if (!v) return;
  inp.value = ''; coachFree(v);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(true); if (S.timer && S.timer.running) holdWake(true); if (S.ui.tab === 'today') renderToday(); } });

function applyLook() {
  const r = document.documentElement;
  if (S.settings.theme === 'system') r.removeAttribute('data-mode'); else r.setAttribute('data-mode', S.settings.theme);
  r.setAttribute('data-accent', S.settings.accent);
  r.setAttribute('lang', 'he'); r.setAttribute('dir', 'rtl');
}

/* ================= Boot ================= */
S = load();
saveNow();
applyLook();
// a timer that ran out while the page was closed
if (S.timer && S.timer.running && Date.now() >= S.timer.endsAt) { setTimeout(() => timerFinished(true), 300); }
const hashTab = (location.hash || '').slice(1);
go(['today', 'plan', 'coach', 'progress', 'settings'].includes(hashTab) ? hashTab : (S.ui.tab || 'today'));
showRest(false);
let lastMin = nowMin();
setInterval(() => {
  tick(false);
  const m = nowMin();
  if (m !== lastMin) { lastMin = m; if (S.ui.tab === 'today' && !$('#sheet-root').innerHTML) renderToday(); showRest(false); }
}, 500);
window.addEventListener('pagehide', saveNow);
})();
</script>
