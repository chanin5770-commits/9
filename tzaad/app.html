<title>צעד אחר צעד</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-width column (max 460px) over a soft tinted field; an aurora wash behind each screen's header; a floating glass tab bar. */
:root {
  /* neutrals (light) */
  --base: #FBF9FC;
  --surface: #FFFFFF;
  --ink: #1C1626;
  --ink-2: #4B4459;
  --muted: #847C93;
  --line-base: #ECE7F1;
  --good: #0F8A6E; --good-soft: #DDF4EC;
  --warn: #A86400; --warn-soft: #FDF0D6;
  --bad: #C8323F; --bad-soft: #FBE3E5;
  --c-work: #5B4BE0; --c-study: #E8603C; --c-home: #0F9D8A; --c-health: #D9A100; --c-personal: #C2408E; --c-break: #A3ABB8;
  --shadow-a: rgba(40, 20, 60, .06);
  --shadow-b: rgba(40, 20, 60, .08);
  /* palette (set by gender + shade) */
  --brand: #7A5CF0;
  --brand-2: #FF9BC0;
  --hero: linear-gradient(135deg, #FF8FB4 0%, #A98BFF 50%, #4F8DFF 100%);
  --glow: rgba(122, 92, 240, .35);
  /* derived */
  --bg: color-mix(in srgb, var(--brand) 4%, var(--base));
  --field: color-mix(in srgb, var(--brand) 9%, var(--base));
  --surface-2: color-mix(in srgb, var(--brand) 6%, var(--surface));
  --surface-3: color-mix(in srgb, var(--brand) 13%, var(--surface));
  --line: color-mix(in srgb, var(--brand) 10%, var(--line-base));
  --brand-soft: color-mix(in srgb, var(--brand) 14%, var(--surface));
  --brand-text: color-mix(in srgb, var(--brand) 82%, var(--ink));
  --brand-ink: #FFFFFF;
  --shadow: 0 1px 2px var(--shadow-a), 0 10px 30px -8px var(--shadow-b);
  --shadow-lg: 0 22px 50px -14px var(--glow);
  --f-display: "Rubik", "Assistant", "Arial Hebrew", system-ui, sans-serif;
  --f-body: "Assistant", "Arial Hebrew", "Segoe UI", system-ui, sans-serif;
  --r-xl: 30px; --r-lg: 24px; --r-md: 20px; --r-sm: 14px;
  --nav-h: 66px;
  --nav-gap: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --base: #120F17; --surface: #1C1823; --ink: #F5F1FA; --ink-2: #CAC2D8; --muted: #8F87A0; --line-base: #2C2735;
    --good: #3DD6A8; --good-soft: #0F2E28; --warn: #F2B544; --warn-soft: #33270E; --bad: #FF7A84; --bad-soft: #3A161B;
    --c-work: #7E6CF5; --c-study: #E0603D; --c-home: #159C88; --c-health: #B08410; --c-personal: #D9559F; --c-break: #5E6875;
    --shadow-a: rgba(0,0,0,.35); --shadow-b: rgba(0,0,0,.45);
    --brand-text: color-mix(in srgb, var(--brand) 60%, #FFFFFF);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --base: #120F17; --surface: #1C1823; --ink: #F5F1FA; --ink-2: #CAC2D8; --muted: #8F87A0; --line-base: #2C2735;
  --good: #3DD6A8; --good-soft: #0F2E28; --warn: #F2B544; --warn-soft: #33270E; --bad: #FF7A84; --bad-soft: #3A161B;
  --c-work: #7E6CF5; --c-study: #E0603D; --c-home: #159C88; --c-health: #B08410; --c-personal: #D9559F; --c-break: #5E6875;
  --shadow-a: rgba(0,0,0,.35); --shadow-b: rgba(0,0,0,.45);
  --brand-text: color-mix(in srgb, var(--brand) 60%, #FFFFFF);
  color-scheme: dark;
}
/* The app's own theme setting wins over host and system */
:root[data-mode="light"] {
  --base: #FBF9FC; --surface: #FFFFFF; --ink: #1C1626; --ink-2: #4B4459; --muted: #847C93; --line-base: #ECE7F1;
  --good: #0F8A6E; --good-soft: #DDF4EC; --warn: #A86400; --warn-soft: #FDF0D6; --bad: #C8323F; --bad-soft: #FBE3E5;
  --c-work: #5B4BE0; --c-study: #E8603C; --c-home: #0F9D8A; --c-health: #D9A100; --c-personal: #C2408E; --c-break: #A3ABB8;
  --shadow-a: rgba(40,20,60,.06); --shadow-b: rgba(40,20,60,.08);
  --brand-text: color-mix(in srgb, var(--brand) 82%, var(--ink));
  color-scheme: light;
}
:root[data-mode="dark"] {
  --base: #120F17; --surface: #1C1823; --ink: #F5F1FA; --ink-2: #CAC2D8; --muted: #8F87A0; --line-base: #2C2735;
  --good: #3DD6A8; --good-soft: #0F2E28; --warn: #F2B544; --warn-soft: #33270E; --bad: #FF7A84; --bad-soft: #3A161B;
  --c-work: #7E6CF5; --c-study: #E0603D; --c-home: #159C88; --c-health: #B08410; --c-personal: #D9559F; --c-break: #5E6875;
  --shadow-a: rgba(0,0,0,.35); --shadow-b: rgba(0,0,0,.45);
  --brand-text: color-mix(in srgb, var(--brand) 60%, #FFFFFF);
  color-scheme: dark;
}
/* Shades: pinks for girls, blues for boys */
:root[data-shade="rose"]      { --brand: #D6336C; --brand-2: #FF9EBB; --glow: rgba(214,51,108,.38); --hero: linear-gradient(135deg, #FFB0C4 0%, #FF6E9B 45%, #D6336C 100%); }
:root[data-shade="raspberry"] { --brand: #C2185B; --brand-2: #FF7AB0; --glow: rgba(194,24,91,.38);  --hero: linear-gradient(135deg, #FF8CC0 0%, #E5357A 50%, #9E1450 100%); }
:root[data-shade="blossom"]   { --brand: #B5468F; --brand-2: #F6A6D6; --glow: rgba(181,70,143,.35); --hero: linear-gradient(135deg, #FFC1DC 0%, #E77BC0 45%, #A24ACB 100%); }
:root[data-shade="ocean"]     { --brand: #2F6FE4; --brand-2: #7CC4FF; --glow: rgba(47,111,228,.38);  --hero: linear-gradient(135deg, #7FD0FF 0%, #3D8BFF 45%, #2550D1 100%); }
:root[data-shade="night"]     { --brand: #3346C9; --brand-2: #8FA2FF; --glow: rgba(51,70,201,.4);    --hero: linear-gradient(135deg, #7E9BFF 0%, #4256E0 50%, #1F2A86 100%); }
:root[data-shade="teal"]      { --brand: #1479B8; --brand-2: #6EE3E0; --glow: rgba(20,121,184,.36);  --hero: linear-gradient(135deg, #74ECDF 0%, #2FB2E6 45%, #2063D6 100%); }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--field);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  direction: rtl;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -.02em; }
p { margin: 0; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

.app {
  position: relative; isolation: isolate;
  max-width: 460px; min-height: 100%; margin: 0 auto;
  background: var(--bg);
  padding-bottom: calc(var(--nav-h) + var(--nav-gap) + 30px + env(safe-area-inset-bottom, 0px));
  overflow-x: clip;
}
.app::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 340px; z-index: -1; pointer-events: none;
  background:
    radial-gradient(70% 90% at 92% -10%, color-mix(in srgb, var(--brand-2) 45%, transparent), transparent 70%),
    radial-gradient(60% 80% at 0% 0%, color-mix(in srgb, var(--brand) 20%, transparent), transparent 70%);
}
@media (min-width: 520px) { .app { box-shadow: 0 0 0 1px var(--line), 0 40px 90px -30px var(--glow); } }
.screen {
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-block: 20px 8px;
  display: flex; flex-direction: column; gap: 18px;
  animation: screenIn .4s cubic-bezier(.2,.8,.2,1);
}
.screen[hidden] { display: none !important; }
@keyframes screenIn { from { opacity: .001; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.topbar h1 { font-size: 28px; line-height: 1.15; }
.eyebrow { font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .02em; }
.sub { color: var(--ink-2); font-size: 15px; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 15px; display: grid; place-items: center; flex: none;
  background: var(--surface); color: var(--ink-2); box-shadow: var(--shadow); border: 1px solid var(--line);
  transition: transform .15s ease;
}
.icon-btn:active { transform: scale(.93); }
.icon-btn svg { width: 22px; height: 22px; }
.me-chip { width: 46px; height: 46px; border-radius: 50%; padding: 3px; background: var(--hero); flex: none; box-shadow: var(--shadow-lg); }
.me-chip span { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: var(--surface); color: var(--brand-text); font-family: var(--f-display); font-weight: 800; font-size: 18px; overflow: hidden; }
.me-chip img { width: 100%; height: 100%; object-fit: cover; }

.card { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow); border: 1px solid var(--line); padding: 16px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.section-head h2 { font-size: 19px; }
.link-btn { color: var(--brand-text); font-weight: 800; font-size: 14px; padding: 6px 4px; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.demo { background: var(--warn-soft); color: var(--warn); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.brand { background: var(--brand-soft); color: var(--brand-text); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 0 18px; border-radius: 16px; font-weight: 800; font-size: 16px;
  background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);
  transition: transform .15s ease, background .2s ease, opacity .2s;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--hero); color: #fff; border: 0; box-shadow: var(--shadow-lg); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 0 12px; font-size: 14px; border-radius: 12px; }
.btn svg { width: 20px; height: 20px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

/* ---------- Auth ---------- */
.auth {
  position: fixed; inset: 0; z-index: 90; overflow-y: auto; background: var(--bg);
  display: flex; flex-direction: column; align-items: center;
}
.auth[hidden] { display: none !important; }
.auth-hero {
  width: 100%; max-width: 460px; position: relative; overflow: hidden; isolation: isolate; flex: none;
  background: var(--hero); color: #fff; border-radius: 0 0 40px 40px;
  padding: calc(46px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) 70px max(24px, env(safe-area-inset-left, 0px));
  text-align: center;
}
.auth-hero::before, .auth-hero::after { content: ""; position: absolute; border-radius: 50%; z-index: -1; background: radial-gradient(circle, rgba(255,255,255,.4), rgba(255,255,255,0) 70%); }
.auth-hero::before { width: 300px; height: 300px; top: -140px; right: -90px; animation: drift 11s ease-in-out infinite alternate; }
.auth-hero::after { width: 220px; height: 220px; bottom: -110px; left: -60px; animation: drift 8s ease-in-out infinite alternate-reverse; }
.logo { width: 76px; height: 76px; margin: 0 auto 16px; border-radius: 24px; background: rgba(255,255,255,.22); backdrop-filter: blur(8px); display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
.logo svg { width: 44px; height: 44px; }
.auth-hero h1 { font-size: 36px; font-weight: 800; }
.auth-hero p { margin-top: 8px; font-size: 17px; opacity: .95; }
.steps { display: flex; justify-content: center; gap: 6px; margin-top: 18px; }
.steps i { width: 10px; height: 10px; border-radius: 3px; background: rgba(255,255,255,.5); animation: stepUp 2.4s ease-in-out infinite; }
.steps i:nth-child(2) { height: 16px; animation-delay: .2s; } .steps i:nth-child(3) { height: 22px; animation-delay: .4s; }
.steps { align-items: flex-end; }
@keyframes stepUp { 0%, 100% { opacity: .5; } 50% { opacity: 1; transform: translateY(-3px); } }
.auth-card {
  width: calc(100% - 32px); max-width: 420px; margin-top: -44px; margin-bottom: 24px; flex: none;
  background: var(--surface); border-radius: var(--r-lg); box-shadow: 0 20px 60px -20px var(--glow), var(--shadow); border: 1px solid var(--line);
  padding: 22px 20px; display: flex; flex-direction: column; gap: 14px;
  animation: screenIn .45s cubic-bezier(.2,.8,.2,1);
}
.auth-card h2 { font-size: 22px; }
.who { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: var(--r-sm); background: var(--surface-2); }
.who img { width: 48px; height: 48px; border-radius: 50%; flex: none; }
.who b { display: block; font-size: 17px; }
.who small { display: block; color: var(--muted); font-weight: 700; direction: ltr; text-align: right; overflow-wrap: anywhere; }
.fine { font-size: 13px; color: var(--muted); font-weight: 600; line-height: 1.45; display: flex; gap: 8px; align-items: flex-start; }
.fine svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }
.spinner { width: 34px; height: 34px; margin: 10px auto; border-radius: 50%; border: 4px solid var(--surface-3); border-top-color: var(--brand); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.gender { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gender button {
  position: relative; border-radius: var(--r-md); padding: 16px 10px 14px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  background: var(--surface-2); border: 2px solid transparent; font-weight: 800; font-size: 17px; transition: transform .15s, border-color .2s, background .2s;
}
.gender button:active { transform: scale(.97); }
.gender .face { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.gender .face svg { width: 34px; height: 34px; }
.gender [data-g="f"] .face { background: linear-gradient(135deg, #FFB0C4, #FF6E9B 50%, #D6336C); }
.gender [data-g="m"] .face { background: linear-gradient(135deg, #7FD0FF, #3D8BFF 50%, #2550D1); }
.gender button[aria-pressed="true"][data-g="f"] { border-color: #D6336C; background: color-mix(in srgb, #D6336C 10%, var(--surface)); }
.gender button[aria-pressed="true"][data-g="m"] { border-color: #2F6FE4; background: color-mix(in srgb, #2F6FE4 10%, var(--surface)); }
.gender small { font-size: 12px; color: var(--muted); font-weight: 700; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.check input { width: 20px; height: 20px; accent-color: var(--brand); flex: none; margin-top: 2px; }

/* ---------- Today ---------- */
.greet h1 { font-size: 30px; }
.greet .dates { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; color: var(--muted); font-size: 14px; font-weight: 700; margin-top: 2px; }
.quote { font-size: 15px; color: var(--ink-2); padding: 14px 16px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); position: relative; padding-inline-start: 44px; font-weight: 600; }
.quote::before { content: "”"; position: absolute; inset-inline-start: 14px; top: 2px; font-family: var(--f-display); font-size: 40px; line-height: 1; color: var(--brand); opacity: .6; }
.banner { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; padding: 12px 14px; border-radius: var(--r-sm); background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 700; }
.banner .grow { flex: 1 1 200px; min-width: 0; }
.banner button { font-weight: 800; text-decoration: underline; text-underline-offset: 3px; color: inherit; }
.banner.info { background: var(--brand-soft); color: var(--brand-text); }

.hero {
  position: relative; overflow: hidden; isolation: isolate;
  border-radius: var(--r-xl); padding: 20px 18px 18px; color: #fff;
  background: var(--hero); box-shadow: var(--shadow-lg);
}
.hero.break { background: linear-gradient(135deg, #7EE2B8 0%, #22B394 50%, #0E7A86 100%); box-shadow: 0 22px 50px -14px rgba(15,140,120,.4); }
.hero::before, .hero::after { content: ""; position: absolute; border-radius: 50%; z-index: -1; pointer-events: none; background: radial-gradient(circle, rgba(255,255,255,.38), rgba(255,255,255,0) 70%); }
.hero::before { width: 280px; height: 280px; top: -130px; left: -90px; animation: drift 12s ease-in-out infinite alternate; }
.hero::after { width: 200px; height: 200px; bottom: -100px; right: -50px; opacity: .7; animation: drift 9s ease-in-out infinite alternate-reverse; }
@keyframes drift { from { transform: translate(0,0); } to { transform: translate(30px, 20px); } }
.hero-top { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.hero .chip { background: rgba(255,255,255,.22); backdrop-filter: blur(6px); color: #fff; padding: 4px 11px; border-radius: 999px; font-size: 13px; font-weight: 800; }
.hero .chip.live { background: #fff; color: var(--brand); display: inline-flex; gap: 6px; align-items: center; }
.hero.break .chip.live { color: #0B6B60; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
.hero-title { font-size: 27px; line-height: 1.2; margin-top: 12px; font-weight: 800; }
.hero-meta { font-size: 14px; opacity: .92; margin-top: 4px; font-weight: 700; }
.glass { margin-top: 16px; padding: 14px; border-radius: var(--r-md); background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); backdrop-filter: blur(10px); display: flex; align-items: center; gap: 16px; }
.ring { position: relative; width: 128px; height: 128px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: scaleX(-1) rotate(-90deg); overflow: visible; }
.ring .track { stroke: rgba(255,255,255,.22); }
.ring .bar { stroke: #fff; transition: stroke-dashoffset .4s linear; filter: drop-shadow(0 0 6px rgba(255,255,255,.7)); }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.tm-time { font-family: var(--f-display); font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; direction: ltr; letter-spacing: -.02em; }
.tm-label { font-size: 12px; font-weight: 800; opacity: .9; margin-top: 6px; }
.tm-side { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
.tm-ctrl { display: flex; gap: 6px; flex-wrap: wrap; }
.glass-btn { min-height: 40px; padding: 0 12px; border-radius: 12px; background: rgba(255,255,255,.2); color: #fff; font-weight: 800; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; transition: background .2s, transform .15s; }
.glass-btn:active { transform: scale(.95); background: rgba(255,255,255,.32); }
.glass-btn[disabled] { opacity: .45; pointer-events: none; }
.glass-btn svg { width: 18px; height: 18px; }
.tm-note { font-size: 13px; opacity: .88; font-weight: 600; }
.hero-actions { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 8px; margin-top: 14px; }
.act-btn { min-height: 56px; border-radius: 18px; font-weight: 800; font-size: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: transform .15s ease; }
.act-btn:active { transform: scale(.95); }
.act-btn svg { width: 20px; height: 20px; }
.act-btn.start { background: #fff; color: var(--brand); box-shadow: 0 8px 20px -8px rgba(0,0,0,.3); }
.hero.break .act-btn.start { color: #0B6B60; }
.act-btn.done { background: rgba(255,255,255,.22); color: #fff; }
.act-btn.fail { background: rgba(0,0,0,.14); color: #fff; }
.hero-empty { text-align: center; padding: 8px 0 4px; }
.hero-empty .big { width: 70px; height: 70px; margin: 0 auto; border-radius: 22px; background: rgba(255,255,255,.22); display: grid; place-items: center; }
.hero-empty .big svg { width: 38px; height: 38px; }
.hero-empty h2 { font-size: 25px; margin-top: 12px; }
.hero-empty p { opacity: .95; margin-top: 6px; font-weight: 600; }
.hero-empty .row { display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.hero-empty .row .act-btn { padding: 0 16px; min-height: 48px; flex-direction: row; gap: 8px; }

.progress-card { display: flex; gap: 14px; align-items: center; }
.mini-ring { width: 66px; height: 66px; flex: none; position: relative; }
.mini-ring svg { width: 100%; height: 100%; transform: scaleX(-1) rotate(-90deg); }
.mini-ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.progress-card .txt { flex: 1; min-width: 0; }
.progress-card .txt b { font-family: var(--f-display); font-weight: 700; font-size: 18px; }
.segbar { display: flex; gap: 3px; margin-top: 8px; height: 8px; }
.segbar span { flex: 1; border-radius: 4px; background: var(--surface-3); }
.segbar span.done { background: var(--good); }
.segbar span.missed { background: var(--bad); }
.segbar span.active { background: var(--brand); animation: pulse 1.6s infinite; }

.tl { position: relative; display: flex; flex-direction: column; gap: 10px; }
.tl::before { content: ""; position: absolute; top: 18px; bottom: 18px; inset-inline-start: 64px; width: 2px; border-radius: 2px; background: var(--surface-3); }
.tl-row { display: grid; grid-template-columns: 46px 22px 1fr; gap: 6px; align-items: center; }
.tl-time { font-family: var(--f-display); font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; color: var(--muted); text-align: center; direction: ltr; }
.tl-dot { justify-self: center; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--cat, var(--c-break)); position: relative; z-index: 1; }
.tl-row.st-done .tl-dot { background: var(--cat); }
.tl-card {
  display: flex; align-items: center; gap: 12px; text-align: start; width: 100%; min-width: 0;
  padding: 12px 14px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line);
  transition: transform .15s ease;
}
.tl-card:active { transform: scale(.98); }
.tl-card .body { flex: 1; min-width: 0; }
.tl-card .title { display: block; font-weight: 800; font-size: 16px; overflow-wrap: anywhere; }
.tl-card .meta { display: block; font-size: 13px; color: var(--muted); font-weight: 700; }
.tl-row.st-done .title { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ink) 35%, transparent); color: var(--muted); }
.tl-row.is-current .tl-card { border-color: var(--brand); box-shadow: 0 0 0 1.5px var(--brand), var(--shadow-lg); }
.tl-row.is-current .tl-time { color: var(--brand-text); font-weight: 800; }
.tl-row.is-break .tl-card { background: repeating-linear-gradient(-45deg, var(--surface), var(--surface) 8px, var(--surface-2) 8px, var(--surface-2) 16px); }
.status-ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--muted); }
.status-ic svg { width: 16px; height: 16px; }
.status-ic.done { background: var(--good-soft); color: var(--good); }
.status-ic.missed { background: var(--bad-soft); color: var(--bad); }
.status-ic.active { background: var(--brand-soft); color: var(--brand-text); }
.tl-now { display: grid; grid-template-columns: 46px 22px 1fr; gap: 6px; align-items: center; color: var(--brand-text); font-weight: 800; font-size: 12px; }
.tl-now .t { text-align: center; direction: ltr; font-family: var(--f-display); }
.tl-now .d { justify-self: center; width: 12px; height: 12px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 5px var(--brand-soft); position: relative; z-index: 1; animation: pulse 2s infinite; }
.tl-now .ln { height: 2px; background: linear-gradient(to left, var(--brand), transparent); border-radius: 2px; }
.empty { text-align: center; padding: 26px 16px; color: var(--muted); border: 2px dashed var(--line); border-radius: var(--r-md); display: flex; flex-direction: column; gap: 10px; align-items: center; font-weight: 600; }
.empty b { color: var(--ink); font-size: 17px; font-family: var(--f-display); font-weight: 700; }

.blur-titles .tl-card .title, .blur-titles .hero-title, .blur-titles .plan-item .title { filter: blur(6px); transition: filter .2s; }
.blur-titles .tl-card:hover .title, .blur-titles .plan-item:hover .title, .blur-titles .hero:hover .hero-title { filter: none; }

/* ---------- Plan ---------- */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); padding: 4px; border-radius: 14px; gap: 4px; border: 1px solid var(--line); }
.seg button { min-height: 38px; border-radius: 10px; font-weight: 800; font-size: 15px; color: var(--ink-2); transition: background .2s, color .2s; padding: 0 8px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--brand-text); box-shadow: var(--shadow); }
.daystrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.daystrip button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 6px; border-radius: 16px; font-size: 12px; font-weight: 800; color: var(--muted); }
.daystrip button .n { font-family: var(--f-display); font-size: 18px; color: var(--ink); font-weight: 600; }
.daystrip button[aria-current="date"] { background: var(--hero); color: #fff; box-shadow: var(--shadow-lg); }
.daystrip button[aria-current="date"] .n { color: #fff; }
.daystrip button.today:not([aria-current="date"]) .n { color: var(--brand-text); font-weight: 800; }
.daystrip button .has { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .6; }
.daystrip button .has.none { opacity: 0; }
.datenav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.datenav .lbl { font-weight: 800; font-size: 17px; font-family: var(--f-display); text-align: center; flex: 1; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
.toolbar .btn { flex: 1 1 auto; min-height: 46px; padding: 0 12px; font-size: 15px; }
.plan-list { display: flex; flex-direction: column; gap: 8px; position: relative; }
.plan-item {
  display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 12px; border-radius: 18px;
  background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); border-inline-start: 5px solid var(--cat, var(--c-break));
  touch-action: pan-y; user-select: none; -webkit-user-select: none;
  transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s;
}
.plan-item.is-break { background: repeating-linear-gradient(-45deg, var(--surface), var(--surface) 8px, var(--surface-2) 8px, var(--surface-2) 16px); }
.plan-item.dragging { transition: none; z-index: 5; position: relative; box-shadow: 0 20px 44px -10px var(--glow); }
.plan-item .handle { width: 36px; height: 44px; display: grid; place-items: center; color: var(--muted); touch-action: none; cursor: grab; border-radius: 10px; flex: none; }
.plan-item .handle svg { width: 20px; height: 20px; }
.plan-item .body { flex: 1; min-width: 0; text-align: start; }
.plan-item .title { display: block; font-weight: 800; overflow-wrap: anywhere; }
.plan-item .meta { font-size: 13px; color: var(--muted); font-weight: 700; display: flex; gap: 8px; flex-wrap: wrap; }
.plan-item .time { font-family: var(--f-display); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; color: var(--ink-2); }
.plan-item.st-done .title { text-decoration: line-through; color: var(--muted); }
.gap-note { font-size: 12px; color: var(--muted); text-align: center; font-weight: 800; }
.hint { font-size: 13px; color: var(--muted); font-weight: 600; }

.week { display: flex; flex-direction: column; gap: 8px; }
.wday { display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); text-align: start; width: 100%; }
.wday.today { border-color: var(--brand); box-shadow: 0 0 0 1.5px var(--brand), var(--shadow); }
.wday .d { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.wday .d small { font-size: 12px; color: var(--muted); font-weight: 800; }
.wday .d b { font-family: var(--f-display); font-size: 22px; font-weight: 700; }
.wday .lane { position: relative; height: 26px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.wday .lane i { position: absolute; top: 4px; bottom: 4px; border-radius: 4px; background: var(--cat); min-width: 3px; }
.wday .lane i.todo { opacity: .45; }
.wday .lane i.missed { opacity: .22; }
.wday .info { font-size: 13px; color: var(--muted); font-weight: 800; text-align: end; white-space: nowrap; }
.wday .info b { display: block; font-family: var(--f-display); color: var(--ink); font-size: 16px; font-weight: 700; }
.wday .rest { color: var(--muted); font-weight: 800; font-size: 14px; }

/* ---------- Coach ---------- */
.coach-head { display: flex; gap: 12px; align-items: center; }
.avatar { width: 50px; height: 50px; border-radius: 17px; background: var(--hero); display: grid; place-items: center; color: #fff; flex: none; box-shadow: var(--shadow-lg); }
.avatar svg { width: 27px; height: 27px; }
.chat { display: flex; flex-direction: column; gap: 10px; padding-bottom: 160px; }
.msg { max-width: 86%; padding: 11px 14px; border-radius: 20px; font-size: 16px; line-height: 1.45; animation: msgIn .3s cubic-bezier(.2,.8,.2,1); white-space: pre-line; overflow-wrap: anywhere; font-weight: 500; }
@keyframes msgIn { from { opacity: .001; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
.msg.coach { align-self: flex-start; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); border-start-start-radius: 6px; }
.msg.me { align-self: flex-end; background: var(--hero); color: #fff; border-start-end-radius: 6px; box-shadow: var(--shadow-lg); }
.msg .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.msg .acts button { padding: 7px 12px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-text); font-weight: 800; font-size: 14px; transition: transform .15s; }
.msg .acts button:active { transform: scale(.95); }
.msg .acts button[disabled] { opacity: .5; }
.msg .stamp { font-size: 11px; color: var(--muted); margin-top: 4px; display: block; font-weight: 600; }
.msg.me .stamp { color: inherit; opacity: .8; }
.typing { display: inline-flex; gap: 4px; padding: 14px 16px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }
.composer {
  position: fixed; z-index: 20; left: 0; right: 0; margin: 0 auto; max-width: 460px;
  bottom: calc(var(--nav-h) + var(--nav-gap) + env(safe-area-inset-bottom, 0px));
  padding: 14px max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, var(--bg) 72%, color-mix(in srgb, var(--bg) 0%, transparent));
  display: flex; flex-direction: column; gap: 8px;
}
.composer[hidden] { display: none !important; }
.quick { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px; }
.quick::-webkit-scrollbar { display: none; }
.quick button { flex: none; padding: 8px 13px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); font-weight: 800; font-size: 14px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.quick button svg { width: 16px; height: 16px; color: var(--brand); }
.composer form { display: flex; gap: 8px; }
.composer input { flex: 1; min-width: 0; min-height: 50px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--surface); padding: 0 16px; font-size: 16px; }
.composer input:focus { outline: none; border-color: var(--brand); }
.composer .send { width: 50px; height: 50px; border-radius: 18px; background: var(--hero); color: #fff; display: grid; place-items: center; flex: none; box-shadow: var(--shadow-lg); }
.composer .send svg { width: 22px; height: 22px; transform: scaleX(-1); }

/* ---------- Progress ---------- */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow); border: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.stat .k { font-size: 13px; color: var(--muted); font-weight: 800; }
.stat .v { font-family: var(--f-display); font-size: 30px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 15px; color: var(--muted); font-weight: 600; }
.stat .d { font-size: 13px; font-weight: 800; }
.stat.lead { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 16px; background: var(--hero); color: #fff; border: 0; box-shadow: var(--shadow-lg); }
.stat.lead .k { color: rgba(255,255,255,.9); }
.stat.lead .v { font-size: 46px; }
.stat.lead svg { width: 86px; height: 86px; flex: none; transform: scaleX(-1) rotate(-90deg); }
.chart-wrap { position: relative; }
.chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart-wrap .axis { fill: var(--muted); font-size: 12px; font-family: var(--f-body); font-weight: 800; }
.chart-wrap .grid { stroke: var(--line); stroke-width: 1; }
.chart-wrap .lbl { fill: var(--ink); font-size: 12px; font-family: var(--f-display); font-weight: 700; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); font-weight: 700; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.tip { position: absolute; z-index: 3; pointer-events: none; background: var(--ink); color: var(--base); padding: 8px 10px; border-radius: 10px; font-size: 13px; font-weight: 700; white-space: nowrap; box-shadow: var(--shadow); }
.tip[hidden] { display: none; }
.catrows { display: flex; flex-direction: column; gap: 10px; }
.catrow { display: grid; grid-template-columns: 70px 1fr 64px; gap: 10px; align-items: center; font-size: 14px; font-weight: 800; }
.catrow .tr { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.catrow .tr i { display: block; height: 100%; border-radius: 6px; background: var(--cat); transform-origin: right; animation: grow .7s cubic-bezier(.2,.8,.2,1); }
@keyframes grow { from { transform: scaleX(0); } }
.catrow .val { text-align: end; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.badge { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow); border: 1px solid var(--line); padding: 12px 6px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.badge .medal { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--hero); color: #fff; box-shadow: var(--shadow-lg); }
.badge .medal svg { width: 26px; height: 26px; }
.badge.locked .medal { background: var(--surface-3); color: var(--muted); box-shadow: none; }
.badge b { font-size: 13px; line-height: 1.25; }
.badge small { font-size: 11px; color: var(--muted); font-weight: 700; line-height: 1.3; }
.badge .pbar { width: 80%; height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
.badge .pbar i { display: block; height: 100%; background: var(--brand); }
.summary p + p { margin-top: 8px; }
.summary p { color: var(--ink-2); font-weight: 500; }
.summary b { color: var(--ink); }
details.table-view summary { cursor: pointer; font-weight: 800; color: var(--brand-text); font-size: 14px; }
.tbl { overflow-x: auto; margin-top: 10px; }
.tbl table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 6px 8px; text-align: start; border-bottom: 1px solid var(--line); }
.tbl th { color: var(--muted); font-weight: 800; }

/* ---------- Settings ---------- */
.account { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: var(--r-lg); background: var(--hero); color: #fff; box-shadow: var(--shadow-lg); }
.account .pic { width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,.25); display: grid; place-items: center; font-family: var(--f-display); font-size: 24px; font-weight: 800; flex: none; overflow: hidden; box-shadow: 0 0 0 3px rgba(255,255,255,.5); }
.account .pic img { width: 100%; height: 100%; object-fit: cover; }
.account .who2 { flex: 1; min-width: 0; }
.account b { font-family: var(--f-display); font-size: 19px; display: block; }
.account small { display: block; opacity: .92; font-weight: 700; direction: ltr; text-align: right; overflow-wrap: anywhere; }
.account .sync { display: inline-flex; gap: 6px; align-items: center; margin-top: 6px; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.22); font-size: 12px; font-weight: 800; }
.account .sync svg { width: 14px; height: 14px; flex: none; }
.group { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; }
.group-title { font-size: 13px; font-weight: 800; color: var(--muted); letter-spacing: .03em; padding: 0 6px; display: flex; gap: 8px; align-items: center; }
.row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 12px; padding: 13px 16px; min-height: 58px; }
.row + .row { border-top: 1px solid var(--line); }
.row .lab { flex: 1 1 150px; min-width: 0; }
.row .lab b { display: block; font-weight: 800; font-size: 16px; }
.row .lab small { display: block; color: var(--muted); font-size: 13px; font-weight: 600; line-height: 1.4; }
.row input[type="text"], .row input[type="time"], .row input[type="number"], .row input[type="date"] {
  min-height: 42px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface-2); padding: 0 10px; font-size: 16px; max-width: 160px;
}
.row input[type="number"] { width: 78px; }
.row input[type="time"], .row input[type="date"] { direction: ltr; }
.row.disabled { opacity: .6; }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--surface-3); transition: background .2s; }
.switch span::after { content: ""; position: absolute; top: 3px; right: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform .25s cubic-bezier(.2,.8,.2,1); }
.switch input:checked + span { background: var(--brand); }
.switch input:checked + span::after { transform: translateX(-20px); }
.switch input:focus-visible + span { outline: 3px solid var(--brand); outline-offset: 2px; }
.swatches { display: flex; gap: 10px; }
.swatches button { width: 36px; height: 36px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px transparent; transition: box-shadow .2s, transform .15s; }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4.5px var(--ink); }
.holidays { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 14px; }
.holidays .pill button { color: var(--bad); font-weight: 800; padding: 0 2px; }

/* ---------- Nav ---------- */
.nav {
  position: fixed; z-index: 30; left: 0; right: 0; margin: 0 auto;
  bottom: calc(var(--nav-gap) + env(safe-area-inset-bottom, 0px));
  width: min(436px, calc(100% - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  height: var(--nav-h); padding: 0 6px; border-radius: 24px;
  background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5);
  border: 1px solid var(--line); box-shadow: 0 16px 40px -12px var(--glow), var(--shadow);
  display: grid; grid-template-columns: repeat(5, 1fr);
}
.nav[hidden] { display: none !important; }
.nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 800; color: var(--muted); position: relative; transition: color .2s; }
.nav button .ic { width: 46px; height: 30px; border-radius: 12px; display: grid; place-items: center; transition: background .3s, color .3s, transform .3s cubic-bezier(.2,.8,.2,1); }
.nav button svg { width: 23px; height: 23px; }
.nav button[aria-current="page"] { color: var(--brand-text); }
.nav button[aria-current="page"] .ic { background: var(--hero); color: #fff; transform: translateY(-1px); box-shadow: 0 6px 14px -4px var(--glow); }
.nav .badge-dot { position: absolute; top: 8px; inset-inline-end: calc(50% - 22px); width: 10px; height: 10px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px var(--surface); }

.mini-timer {
  position: fixed; z-index: 25; left: 0; right: 0; margin: 0 auto; width: max-content; max-width: calc(100% - 32px);
  bottom: calc(var(--nav-h) + var(--nav-gap) + 12px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 999px;
  background: var(--hero); color: #fff; box-shadow: var(--shadow-lg); font-weight: 800; font-size: 14px;
  animation: msgIn .3s ease;
}
.mini-timer .tm { font-family: var(--f-display); font-size: 18px; direction: ltr; font-variant-numeric: tabular-nums; background: rgba(255,255,255,.22); padding: 2px 10px; border-radius: 999px; }
.mini-timer .ttl { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Sheet & toast ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(15, 8, 30, .45); backdrop-filter: blur(3px); animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  position: fixed; z-index: 51; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 460px; max-height: 88%;

const clone = (o) => JSON.parse(JSON.stringify(o));

/* Example data: today built around the current time, plus 13 past days for the charts. All flagged sample:true. */
function seedTasks(gender) {
  const tasks = [];
  const today = todayKey();
  const g = (f, m) => (gender === 'm' ? m : f);
  const mk = (date, start, dur, title, cat, extra = {}) => tasks.push({ id: uid(), date, start: fromMin(start), dur, title, cat, type: 'task', status: 'todo', focusedSec: 0, sample: true, ...extra });
  const brk = (date, start, dur, title = 'הפסקה') => tasks.push({ id: uid(), date, start: fromMin(start), dur, title, cat: 'break', type: 'break', status: 'todo', focusedSec: 0, sample: true });
  const plan = [
    [45, 'תכנון בוקר וקפה', 'personal', 'done'],
    [15, 'הפסקה קצרה', 'break', 'done'],
    [50, 'כתיבת המצגת ללקוח', 'work'],
    [10, 'הפסקה ומים', 'break'],
    [40, 'מענה למיילים חשובים', 'work'],
    [30, 'הליכה של חצי שעה', 'health'],
    [45, 'קריאה לקורס', 'study'],
    [20, 'קניות לשבת', 'home'],
    [15, 'סיכום יום ותכנון מחר', 'personal'],
  ];
  let s = Math.floor(nowMin() / 30) * 30 - 60;
  for (const [dur, title, cat, st] of plan) {
    if (s < 0) { s += dur; continue; }
    if (s + dur >= 24 * 60) break;
    if (cat === 'break') brk(today, s, dur, title); else mk(today, s, dur, title, cat);
    const last = tasks[tasks.length - 1];
    if (st === 'done') { last.status = 'done'; last.focusedSec = dur * 60; last.doneAt = Date.now(); }
    s += dur;
  }
  let seed = 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const pool = [
    ['עבודה עמוקה על הפרויקט', 'work', 90], ['פגישת צוות', 'work', 45], ['מיילים והודעות', 'work', 30], ['הכנת דוח שבועי', 'work', 60],
    ['תרגול לקורס', 'study', 45], ['צפייה בהרצאה', 'study', 60],
    ['כביסה וסידור', 'home', 30], ['בישול לשבוע', 'home', 60],
    ['אימון', 'health', 45], ['הליכה', 'health', 30],
    [g('שיחה עם חברה', 'שיחה עם חבר'), 'personal', 30], ['יומן ותכנון', 'personal', 15],
  ];
  for (let back = 13; back >= 1; back--) {
    const date = addDays(today, -back);
    const dow = dateOf(date).getDay();
    if (dow === 6) continue;
    const count = dow === 5 ? 3 : 4 + Math.floor(rnd() * 3);
    let m = 8 * 60 + 30;
    const used = new Set();
    for (let i = 0; i < count; i++) {
      let p; do { p = pool[Math.floor(rnd() * pool.length)]; } while (used.has(p[0]));
      used.add(p[0]);
      const status = rnd() < (back > 6 ? 0.68 : 0.8) ? 'done' : 'missed';
      mk(date, m, p[2], p[0], p[1], { status, focusedSec: status === 'done' ? Math.round(p[2] * 60 * (0.75 + rnd() * 0.25)) : 0 });
      m += p[2];
      if (i % 2 === 1) { brk(date, m, 15); tasks[tasks.length - 1].status = 'done'; m += 15; }
    }
  }
  return tasks;
}

async function waitForClaude(ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) { if (window.claude && typeof window.claude.use === 'function') return window.claude; await new Promise((r) => setTimeout(r, 100)); }

  if (!me || !me.id) return null;

/* ================= Task helpers ================= */
const tasksOn = (k) => S.tasks.filter((t) => t.date === k).sort((a, b) => toMin(a.start) - toMin(b.start) || (a.order ?? 0) - (b.order ?? 0));
const getTask = (id) => S.tasks.find((t) => t.id === id);
const endMin = (t) => toMin(t.start) + t.dur;
const isWork = (t) => t.type !== 'break';
function currentTask() {
  const k = todayKey();
  const list = tasksOn(k);
  if (S.timer && S.timer.taskId) { const t = getTask(S.timer.taskId); if (t && t.date === k && t.status !== 'done' && t.status !== 'missed') return t; }
  const active = list.find((t) => t.status === 'active'); if (active) return active;
  if (S.focusId) { const f = getTask(S.focusId); if (f && f.date === k && f.status === 'todo') return f; }
  const n = nowMin();
  const open = list.filter((t) => t.status === 'todo');
  return open.find((t) => toMin(t.start) <= n && endMin(t) > n) || open.find((t) => toMin(t.start) > n) || open[0] || null;
}

/* ================= Sound, vibration, confetti ================= */
let actx;

    const t0 = actx.currentTime;

      g.gain.exponentialRampToValueAtTime(0.001, t0 + i * 0.16 + 0.9);

}
function buzz(p) { if (S && S.settings.vibrate && navigator.vibrate) { try { navigator.vibrate(p); } catch {} } }

  const cols = S.settings.gender === 'm' ? ['#7FD0FF', '#3D8BFF', '#2550D1', '#74ECDF', '#FFC044', '#FFFFFF'] : ['#FFB0C4', '#FF6E9B', '#D6336C', '#E77BC0', '#FFC044', '#FFFFFF'];
  const ps = Array.from({ length: 120 }, () => ({ x: innerWidth / 2, y: innerHeight * 0.36, vx: (Math.random() - 0.5) * 13, vy: -Math.random() * 13 - 3, r: Math.random() * 6 + 4, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6, va: (Math.random() - 0.5) * 0.4 }));
  const t0 = performance.now();
  (function frame(t) {
    const el = t - t0; ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) { p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.globalAlpha = Math.max(0, 1 - el / 1800); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); }

}

/* ================= Timer ================= */
// S.timer = { taskId|null, label, total (sec), remaining (sec), endsAt (ms)|null, running, segStart (ms)|null }
let wakeLock = null;
async function holdWake(on) {
  try {

  const tm = S.timer; if (!tm || !tm.running || !tm.segStart) return;
  const t = tm.taskId && getTask(tm.taskId);
  const sec = Math.min((Date.now() - tm.segStart) / 1000, tm.total);

  tm.segStart = Date.now();
}
function timerStart(taskId, minutes, label) {

  holdWake(true); save(); tick(true);
}

function timerAdd(min) { const tm = S.timer; if (!tm) return; tm.total += min * 60; if (tm.running) tm.endsAt += min * 60000; else tm.remaining += min * 60; save(); tick(true); }

  const tm = S.timer; if (!tm) return;
  creditFocus();
  tm.running = false; tm.remaining = 0; tm.endsAt = null; tm.segStart = null;
  holdWake(false); save();
  if (!silent) { chime(); buzz([200, 100, 200, 100, 400]); }
  const t = tm.taskId && getTask(tm.taskId);
  if (t && t.status === 'active') {
    openSheet(`<h3>הזמן הסתיים</h3><p class="sub">איך הלך עם <b>${esc(t.title)}</b>?</p>
      <div class="option-list">

        <button class="option" data-act="timer-extend" data-arg="5"><span class="ic">${IC.plus}</span><span><b>עוד 5 דקות</b><small>הטיימר ממשיך מאותה נקודה</small></span></button>
        <button class="option" data-act="task-fail" data-arg="${t.id}"><span class="ic">${IC.later}</span><span><b>לא הצלחתי</b><small>נמצא יחד פתרון</small></span></button>

const RING_C = 2 * Math.PI * 56;

  const rem = timerRemaining();

/* ---------- Progress ---------- */
function calcStreak() {
  let k = todayKey(); let n = 0;
  const doneOn = (d) => S.tasks.some((t) => t.date === d && t.status === 'done' && isWork(t));
  const rest = (d) => (S.settings.shabbat && dateOf(d).getDay() === 6) || S.settings.holidays.includes(d) || (!S.tasks.some((t) => t.date === d) && dateOf(d).getDay() === 6);
  if (!doneOn(k)) k = addDays(k, -1);
  for (let i = 0; i < 400; i++) { if (doneOn(k)) n++; else if (!rest(k)) break; k = addDays(k, -1); }
  return n;
}
function dayStats(d) {
  const w = tasksOn(d).filter(isWork);
  return { planned: w.length, done: w.filter((t) => t.status === 'done').length, missed: w.filter((t) => t.status === 'missed').length, focus: Math.round(tasksOn(d).reduce((a, t) => a + (t.focusedSec || 0), 0) / 60) };
}
function achievements() {
  const all = S.tasks.filter(isWork);
  const doneAll = all.filter((t) => t.status === 'done').length;
  const breaks = S.tasks.filter((t) => t.type === 'break' && t.status === 'done').length;
  const dates = [...new Set(S.tasks.map((t) => t.date))];
  const maxFocus = Math.max(0, ...dates.map((d) => dayStats(d).focus));
  const perfect = dates.some((d) => { const s = dayStats(d); return s.planned >= 3 && s.done === s.planned; });
  const comeback = dates.some((d) => { const l = tasksOn(d).filter(isWork); const i = l.findIndex((t) => t.status === 'missed'); return i >= 0 && l.slice(i + 1).some((t) => t.status === 'done'); });
  const streak = calcStreak();
  return [
    { t: 'צעד ראשון', d: 'משימה ראשונה שבוצעה', ic: IC.shoe, v: Math.min(doneAll, 1), max: 1 },
    { t: 'רצף של 3', d: '3 ימים ברצף עם ביצוע', ic: IC.flame, v: Math.min(streak, 3), max: 3 },
    { t: 'שבוע של התמדה', d: '7 ימים ברצף', ic: IC.flame, v: Math.min(streak, 7), max: 7 },
    { t: 'שעת פוקוס', d: '60 דקות פוקוס ביום אחד', ic: IC.clock, v: Math.min(maxFocus, 60), max: 60 },
    { t: '10 משימות', d: 'סך הכול 10 משימות', ic: IC.check, v: Math.min(doneAll, 10), max: 10 },
    { t: '50 משימות', d: 'סך הכול 50 משימות', ic: IC.trophy, v: Math.min(doneAll, 50), max: 50 },
    { t: G('קמה מחדש', 'קם מחדש'), d: 'ביצוע אחרי משימה שלא הצליחה', ic: IC.rise, v: comeback ? 1 : 0, max: 1 },
    { t: G('יודעת לנוח', 'יודע לנוח'), d: '5 הפסקות שנלקחו', ic: IC.cup, v: Math.min(breaks, 5), max: 5 },
    { t: 'יום מושלם', d: 'כל המשימות של יום בוצעו', ic: IC.star, v: perfect ? 1 : 0, max: 1 },
  ];
}

/* ================= Drag to reorder (Plan) ================= */
function setupDrag() {
  const list = $('#plan-list'); if (!list) return;
  let st = null;
  list.addEventListener('pointerdown', (e) => {
    const h = e.target.closest('[data-drag]'); if (!h) return;
    e.preventDefault();
    const item = h.closest('.plan-item');
    const items = $$('.plan-item', list);
    st = { item, items, from: items.indexOf(item), to: items.indexOf(item), y0: e.clientY, rects: items.map((x) => x.getBoundingClientRect()), id: e.pointerId };
    h.setPointerCapture(e.pointerId);
    item.classList.add('dragging');
    buzz(15);
  });
  list.addEventListener('pointermove', (e) => {
    if (!st || e.pointerId !== st.id) return;
    const dy = e.clientY - st.y0;
    st.item.style.transform = `translateY(${dy}px) scale(1.02)`;
    const r = st.rects[st.from]; const mid = r.top + r.height / 2 + dy;
    let to = st.from;
    st.rects.forEach((rr, i) => { if (i > st.from && mid > rr.top + rr.height / 2) to = i; });
    if (to === st.from) for (let i = st.from - 1; i >= 0; i--) if (mid < st.rects[i].top + st.rects[i].height / 2) to = i;
    st.to = to;
    const hgt = r.height + 8;
    st.items.forEach((x, i) => { if (x === st.item) return; let s = 0; if (st.from < to && i > st.from && i <= to) s = -hgt; if (st.from > to && i >= to && i < st.from) s = hgt; x.style.transform = s ? `translateY(${s}px)` : ''; });
    if (e.clientY < 80) window.scrollBy(0, -8); else if (e.clientY > innerHeight - 140) window.scrollBy(0, 8);
  });
  const end = (e) => {
    if (!st || e.pointerId !== st.id) return;
    const { from, to } = st; st.items.forEach((x) => { x.style.transform = ''; }); st.item.classList.remove('dragging');
    st = null;
    if (from !== to) moveTask(from, to);
  };
  list.addEventListener('pointerup', end);
  list.addEventListener('pointercancel', end);
  list.addEventListener('keydown', (e) => {
    const h = e.target.closest('[data-drag]'); if (!h) return;
    const items = $$('.plan-item', list); const i = items.indexOf(h.closest('.plan-item'));
    if (e.key === 'ArrowUp' && i > 0) { e.preventDefault(); moveTask(i, i - 1, true); }
    if (e.key === 'ArrowDown' && i < items.length - 1) { e.preventDefault(); moveTask(i, i + 1, true); }
  });
}
function moveTask(from, to, keepFocus) {
  const k = S.ui.planDate;
  const list = tasksOn(k);
  const startAt = toMin(list[0].start);
  snapshot();
  const [m] = list.splice(from, 1); list.splice(to, 0, m);
  reflow(list, startAt);
  save(); renderPlan(); setupDrag(); renderToday();
  toast('הסדר עודכן והשעות סודרו ברצף', { undo: true });
  if (keepFocus) { const h = $(`.plan-item[data-id="${m.id}"] [data-drag]`); h && h.focus(); }
}

  },
  'fail-later': (a) => { const t = getTask(a); if (!t) return; stopIf(t); snapshot(); t.status = 'todo'; t.start = fromMin(Math.max(nowMin(), toMin(t.start)) + 60); t.reminded = false; if (S.focusId === t.id) S.focusId = null; save(); closeSheet(); renderAll(); toast(`נדחה ל־${t.start}`, { undo: true }); },
  'fail-tomorrow': (a) => { const t = getTask(a); if (!t) return; stopIf(t); snapshot(); t.status = 'todo'; t.date = addDays(t.date, 1); t.reminded = false; if (S.focusId === t.id) S.focusId = null; save(); closeSheet(); renderAll(); toast('הועבר למחר', { undo: true }); },
  'fail-mark': (a) => { const t = getTask(a); if (!t) return; stopIf(t); snapshot(); t.status = 'missed'; if (S.focusId === t.id) S.focusId = null; save(); closeSheet(); renderAll(); toast('נרשם. ממשיכים הלאה.', { undo: true }); },
  'fail-coach': () => { closeSheet(true); go('coach'); coachIntent('stuck'); },
  'timer-toggle': (a) => {
    const t = getTask(a);
    if (S.timer && S.timer.taskId === a) { S.timer.running ? timerPause() : timerResume(); }
    else if (t) { if (t.status === 'todo') { t.status = 'active'; t.startedAt = Date.now(); S.focusId = t.id; } timerStart(a, t.dur); }
    renderToday();
  },
  'timer-extend': (a) => { if (!S.timer) return; const was = S.timer.running || S.timer.remaining === 0; timerAdd(+a || 5); if (!S.timer.running && was) timerResume(); closeSheet(true); renderToday(); toast(`נוספו ${a} דקות`); },
  'timer-reset': () => { timerReset(); renderToday(); toast('הטיימר אופס'); },
  'hide-banner': () => { S.sampleBanner = false; save(); renderToday(); },
  'clear-sample': () => openSheet(`<h3>למחוק את נתוני הדוגמה?</h3><p class="sub">כל המשימות לדוגמה, כולל ההיסטוריה בגרפים, יימחקו. משימות ${G('שהוספת או ערכת', 'שהוספת או ערכת')} יישארו.</p>
      <div class="actions"><button class="btn danger" data-act="clear-sample-yes">מחיקה</button><button class="btn" data-act="sheet-close">ביטול</button></div>`),
  'clear-sample-yes': () => { snapshot(); if (S.timer && S.timer.taskId && getTask(S.timer.taskId)?.sample) timerStop(); S.tasks = S.tasks.filter((t) => !t.sample); S.focusId = null; save(); closeSheet(); renderAll(); toast('נתוני הדוגמה נמחקו', { undo: true }); },
  'reset-all': () => openSheet(`<h3>למחוק את כל הנתונים שלך?</h3><p class="sub">כל המשימות, השיחה וההגדרות שלך יימחקו${Acc.mode === 'cloud' ? ' מהחשבון' : ' מהמכשיר הזה'}. אי אפשר לבטל את הפעולה.</p>
      <div class="actions"><button class="btn danger" data-act="reset-yes">כן, למחוק</button><button class="btn" data-act="sheet-close">ביטול</button></div>`),
  'reset-yes': async () => {
    closeSheet(); clearTimeout(saveT); saveT = null;
    if (Acc.unsub) { Acc.unsub(); Acc.unsub = null; }
    if (Acc.mode === 'cloud' && Acc.ref && !Acc.readOnly) { try { await Acc.ref.delete(); } catch {} }
    if (cacheKey()) LS.del(cacheKey());
    holdWake(false);
    S = null;
    $('#mini-timer-slot').innerHTML = ''; $('#composer').hidden = true;
    toast('הנתונים נמחקו');
    if (Acc.mode === 'cloud') showOnboarding((s) => { enterApp(s, true); }); else showOnboarding((s) => enterApp(s, true));
  },
  'plan-view': (a) => { S.ui.planView = a; save(); renderPlan(); setupDrag(); },
  'plan-day': (a) => { S.ui.planDate = a; S.ui.planView = 'day'; save(); if (S.ui.tab !== 'plan') go('plan'); else { renderPlan(); setupDrag(); } },
  'plan-shift': (a) => { S.ui.planDate = addDays(S.ui.planDate || todayKey(), +a); save(); renderPlan(); setupDrag(); },
  'plan-today': () => { S.ui.planDate = todayKey(); save(); renderPlan(); setupDrag(); },
  'compact-day': (a) => { const list = tasksOn(a); if (list.length < 2) return; snapshot(); reflow(list, toMin(list[0].start)); save(); renderPlan(); setupDrag(); renderToday(); toast('הרווחים והחפיפות סודרו', { undo: true }); },
  'delete-task': (a, el) => {
    if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.innerHTML = `${IC.trash}בטוח?`; setTimeout(() => { if (el.isConnected) { el.dataset.confirm = ''; el.innerHTML = `${IC.trash}מחיקה`; } }, 3000); return; }
    snapshot(); if (S.timer && S.timer.taskId === a) timerStop(); S.tasks = S.tasks.filter((t) => t.id !== a); if (S.focusId === a) S.focusId = null; save(); closeSheet(); renderAll(); toast('נמחק', { undo: true });
  },
  'coach-intent': (a) => { if (S.ui.tab !== 'coach') go('coach'); coachIntent(a); },
  'coach-do': (a) => { const [mid, i] = a.split(':'); const m = S.chat.find((x) => x.id === mid); if (!m || m.used) return; const act = m.actions[+i]; if (!act) return; coachDo(act, m); if (S.ui.tab === 'coach') renderCoach(); },
  'chat-clear': () => { S.chat = []; save(); renderCoach(); toast('השיחה נוקתה'); },
  set: (a) => { const [k, v] = a.split(':'); S.settings[k] = v; save(); applyLook(); renderSettings(); },
  'set-gender': (a) => { if (S.settings.gender === a) return; S.settings.gender = a; S.settings.shade = SHADES[a][0][0]; save(); applyLook(); renderSettings(); renderToday(); toast(a === 'm' ? 'עברנו לפנייה בלשון זכר ולגוונים כחולים' : 'עברנו לפנייה בלשון נקבה ולגוונים ורודים'); },
  'test-sound': () => { const was = S.settings.sound; S.settings.sound = true; chime(); S.settings.sound = was; buzz(120); },
  export: async () => {
    const txt = JSON.stringify({ app: 'צעד אחר צעד', exported: new Date().toISOString(), settings: S.settings, tasks: S.tasks }, null, 1);
    try { await navigator.clipboard.writeText(txt); toast('הנתונים הועתקו ללוח'); }
    catch {
      openSheet(`<h3>העתקת הנתונים</h3><p class="sub">הדפדפן לא איפשר העתקה אוטומטית. אפשר לסמן את הטקסט ולהעתיק ידנית.</p><textarea id="export-txt" readonly style="width:100%;height:220px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);padding:10px;direction:ltr;font-size:12px">${esc(txt)}</textarea><button class="btn block" data-act="sheet-close">סגירה</button>`);
      setTimeout(() => { const ta = $('#export-txt'); ta && ta.select(); }, 100);
    }
  },
  'rest-preview': () => showRest(true),
  'rest-close': () => { shabbatDismissed = true; $('#shabbat-root').innerHTML = ''; },
  'add-holiday': () => { const v = $('#holiday-date').value; if (!v) { toast(G('בחרי תאריך', 'בחר תאריך')); return; } if (!S.settings.holidays.includes(v)) S.settings.holidays.push(v); save(); renderSettings(); toast(`${fmtDateShort(v)} סומן כיום חג`); shabbatDismissed = false; showRest(false); },
  'del-holiday': (a) => { S.settings.holidays = S.settings.holidays.filter((h) => h !== a); save(); renderSettings(); showRest(false); },
  'prog-week': (a) => { S.ui.progWeek = +a; save(); renderProgress(); },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  if (!S && !['login-cloud', 'sheet-close'].includes(el.dataset.act)) return;
  e.preventDefault();
  fn(el.dataset.arg, el);
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'login-form') return;
  e.preventDefault();
  const v = $('#login-email').value.trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) { showLocalLogin('כתובת המייל לא נראית תקינה. כדאי לבדוק אותה ולנסות שוב.'); return; }
  loginLocal(v);
});
document.addEventListener('change', (e) => {
  if (!S) return;
  const id = e.target.id || '';
  if (!id.startsWith('set-')) return;
  const k = id.slice(4); const st = S.settings;
  if (e.target.type === 'checkbox') st[k] = e.target.checked;
  else if (e.target.type === 'number') { const min = +e.target.min || 5, max = +e.target.max || 600; st[k] = clamp(Math.round(+e.target.value || st[k]), min, max); e.target.value = st[k]; }
  else st[k] = e.target.value.trim();
  save();
  if (k === 'name') { toast(st.name ? `נעים להכיר, ${st.name}!` : 'השם הוסר'); renderToday(); renderSettings(); }
  else toast('נשמר');
  if (k === 'shabbat' || k === 'candle' || k === 'havdalah') { shabbatDismissed = false; showRest(false); renderSettings(); }
  if (k === 'discreet') renderToday();
});
$('#chat-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const inp = $('#chat-input'); const v = inp.value.trim(); if (!v || !S) return;
  inp.value = ''; coachFree(v);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
document.addEventListener('visibilitychange', () => {
  if (!S) return;
  if (document.hidden) { if (saveT) saveNow(); return; }
  tick(true); if (S.timer && S.timer.running) holdWake(true); if (S.ui.tab === 'today' && !$('#sheet-root').innerHTML) renderToday();
});
window.addEventListener('pagehide', () => { if (S && saveT) saveNow(); });

function applyLook() {
  const r = document.documentElement;
  if (!S || S.settings.theme === 'system') r.removeAttribute('data-mode'); else r.setAttribute('data-mode', S.settings.theme);
  if (S) r.setAttribute('data-shade', S.settings.shade); else r.removeAttribute('data-shade');
  r.setAttribute('lang', 'he'); r.setAttribute('dir', 'rtl');
}

/* ================= Boot ================= */
(async function boot() {
  applyLook();
  showAuthLoading();
  acct = await detectAccount();
  if (acct) showCloudLogin(); else showLocalLogin();
})();
let lastMin = nowMin();
setInterval(() => {
  if (!S) return;
  tick(false);
  const m = nowMin();
  if (m !== lastMin) { lastMin = m; if (S.ui.tab === 'today' && !$('#sheet-root').innerHTML) renderToday(); showRest(false); }
}, 500);
})();
</script>
