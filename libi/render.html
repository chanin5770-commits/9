<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><title>Render</title>
<link rel="stylesheet" href="src/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="src/beats.js"></script><script src="src/clip.js"></script>
<script>
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  window.__ready = CLIP.load('');
  window.__frame = (t, type = 'image/jpeg', q = 0.94) => { CLIP.render(ctx, t); return cv.toDataURL(type, q); };
  window.__timeline = () => CLIP.timeline();
</script></body></html>
