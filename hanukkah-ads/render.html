<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>render</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="src/engine.js"></script><script src="src/videos.js"></script><script src="src/videos2.js"></script>
<script>
const ctx=document.getElementById('c').getContext('2d');
async function fonts(){
  const list=[['Fredoka','assets/fonts/fredoka-700.woff2','700'],['Rubik','assets/fonts/rubik-800.woff2','800'],['Noto Sans Hebrew','assets/fonts/noto-800.woff2','800']];
  for(const [f,u,w] of list){const ff=new FontFace(f,`url(${u})`,{weight:w});await ff.load();document.fonts.add(ff);}
}
window.__init=async(id)=>{await fonts();const beats=await (await fetch('assets/audio/beats.json')).json();return ADS.init(id,beats[ADS.VIDEOS[id].audio]);};
window.__frame=(t,type='image/jpeg',q=0.93)=>{ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ADS.draw(ctx,t);return document.getElementById('c').toDataURL(type,q);};
</script></body></html>
