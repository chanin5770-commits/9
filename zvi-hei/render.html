<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><title>Render</title>
<link rel="stylesheet" href="src/fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="src/config.js"></script>
<script src="src/video.js"></script>
<script>
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  window.__ready = ZVI.loadAssets('');
  window.__frame = (t, type = 'image/jpeg', q = 0.93) => { ZVI.render(ctx, t); return cv.toDataURL(type, q); };
  window.__cover = () => { ctx.setTransform(1,0,0,1,0,0); ZVI.renderCover(ctx); return cv.toDataURL('image/jpeg', 0.95); };
</script>
</body></html>
