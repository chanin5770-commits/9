<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Numbers teaser overlay render</title>
<link rel="stylesheet" href="src/fonts.css">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="src/timeline.js"></script>
<script src="src/audio.js"></script>
<script src="src/numbers.js"></script>
<script>
  // Hooks driven by tools/render-numbers.cjs
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  window.__ready = Promise.all(['700 50px Heebo', '800 90px Heebo', '900 120px Heebo'].map((f) => document.fonts.load(f, 'ממלכת Studio')));
  window.__overlay = (t) => { AD.NUMBERS.renderOverlay(ctx, t); return cv.toDataURL('image/png'); };
  window.__audio = async () => {
    const sr = 48000;
    const oac = new OfflineAudioContext(2, sr * AD.NUMBERS.DUR, sr);
    AD.buildNumbersAudio(oac, { startAt: 0 });
    const bytes = AD.encodeWav(await oac.startRendering());
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  };
</script>
</body>
</html>
