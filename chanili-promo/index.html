<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHANI LI · פרומו הדמיות</title>
<style>
  html, body { margin: 0; height: 100%; background: #140d11; color: #fbefe9; font-family: Heebo, Arial, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; box-sizing: border-box; }
  canvas { max-width: 100%; max-height: calc(100vh - 90px); border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button { background: #eab09a; color: #140d11; border: 0; border-radius: 999px; padding: 9px 18px; font: 600 15px Heebo, Arial, sans-serif; cursor: pointer; }
  button.ghost { background: transparent; color: #fbefe9; border: 1px solid rgba(251,239,233,.3); }
  #time { font-variant-numeric: tabular-nums; opacity: .7; min-width: 70px; text-align: center; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="bar">
  <button id="play" type="button">הפעלה עם סאונד</button>
  <button id="fmt" class="ghost" type="button">לרוחב 16:9</button>
  <span id="time">0.0 / 30</span>
</div>
<script src="config.js"></script>
<script src="promo.js"></script>
<script>
(async () => {
  const c = document.getElementById('c'), A = window.PROMO_APP;
  // Render hooks for tools/render.cjs
  window.__ready = A.load().then(() => true);
  window.__size = (w, h) => { c.width = w; c.height = h; };
  window.__frame = (t, type = 'image/jpeg', q = 0.95) => { A.draw(c, t); return c.toDataURL(type, q); };
  window.__audio = async () => { const buf = await A.renderAudio(); let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
  await window.__ready;
  let ac = null, t0 = 0, playing = false;
  const time = document.getElementById('time');
  A.draw(c, 6.0);
  document.getElementById('play').onclick = () => {
    if (ac) ac.close(); ac = new AudioContext(); A.buildAudio(ac); t0 = ac.currentTime; playing = true;
    const tick = () => { if (!playing) return; const t = ac.currentTime - t0; if (t >= A.DUR) { playing = false; A.draw(c, A.DUR - 0.01); return; } A.draw(c, t); time.textContent = t.toFixed(1) + ' / 30'; requestAnimationFrame(tick); };
    tick();
  };
  document.getElementById('fmt').onclick = (e) => { const v = c.height > c.width; c.width = v ? 1920 : 1080; c.height = v ? 1080 : 1920; e.target.textContent = v ? 'לאורך 9:16' : 'לרוחב 16:9'; if (!playing) A.draw(c, 6.0); };
})();
</script>
</body>
</html>
